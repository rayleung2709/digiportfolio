name: fetch prices
on:
  schedule:
    - cron: "45 17 * * 1-5"   # UTC 17:45 = HKT 01:45，LSE 收市後（冬夏令都掩到）
  workflow_dispatch:
    inputs:
      backfill:
        description: "由第一日重建 history.json"
        type: boolean
        default: false

permissions:
  contents: write
concurrency: prices

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - run: python fetch_prices.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: commit
        run: |
          git config user.name  "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json data/history.json
          git diff --cached --quiet || (git commit -m "prices $(date -u +%F)" && git push)
