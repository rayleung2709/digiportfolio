<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚦 香港交通儀表板 HK Transport Dashboard</title>
<style>
  .dash-header{
  display:flex; align-items:center; gap:10px;
  padding:10px; position:sticky; top:0; background:#fff; z-index:5;
  border-bottom:1px solid #eee;
}
.dash-header .muted{ flex:1; font-size:12px; }
.btn-refresh, .btn-add{
  border:none; border-radius:8px; padding:8px 12px;
  background:#1a73e8; color:#fff; font-weight:600;
}
.btn-add{ background:#34a853; }

.dash-list{ padding:10px; display:flex; flex-direction:column; gap:10px; }

.dash-card{
  background:#fff; border-radius:12px; padding:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
  position:relative;
}
.dash-card-title{ font-weight:700; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
.dash-card-title .name{ color:#111; }
.dash-card-title .remove-btn{ color:#999; font-size:18px; background:none; border:none; }

.dash-eta-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 0; border-top:1px solid #f2f2f2;
}
.dash-eta-route{ font-weight:600; }
.dash-eta-dest{ font-size:12px; color:#666; }
.dash-eta-min{ font-weight:700; font-size:16px; color:#1a73e8; }
.dash-eta-min.soon{ color:#e94235; }
.dash-eta-min.warn{ color:#f9a825; }

.modal{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:50; }
.modal.hidden{ display:none; }
.modal-box{ background:#fff; border-radius:12px; padding:16px; width:90%; max-width:400px; max-height:85vh; overflow-y:auto; }
.fav-type-switch{ display:flex; gap:6px; margin-bottom:10px; }
.fav-type-btn{ flex:1; padding:8px; border-radius:8px; border:1px solid #ddd; background:#f5f5f5; font-size:12px; }
.fav-type-btn.active{ background:#1a73e8; color:#fff; border-color:#1a73e8; }
.fav-form.hidden{ display:none; }
.fav-form input{ width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; margin:6px 0; }
.stop-result-list .stop-result{ padding:8px; border-bottom:1px solid #f0f0f0; }
.stop-result-list .stop-result.selected{ background:#e8f0fe; }
.modal-actions{ display:flex; gap:8px; margin-top:12px; }
.btn-primary{ background:#34a853; color:#fff; border:none; border-radius:8px; padding:10px; flex:1; }
:root{
  --bg:#0f1420; --card:#1b2333; --accent:#00d4ff; --accent2:#7cffb2;
  --text:#e6ecf5; --muted:#8a94a6; --danger:#ff5f6d; --border:#263252;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI','Noto Sans TC',sans-serif;
  background:linear-gradient(160deg,#0f1420,#141b2d 60%,#1a2238);
  color:var(--text);min-height:100vh;}
header{padding:24px 16px 8px;text-align:center;}
header h1{margin:0;font-size:1.6rem;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
header p{color:var(--muted);margin:4px 0 0;font-size:.85rem;}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px auto;padding:0 12px;}
.tab-btn{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:999px;cursor:pointer;font-size:.9rem;transition:.2s;}
.tab-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#08101c;font-weight:600;border-color:transparent;}
main{max-width:900px;margin:0 auto;padding:0 16px 60px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
select,input[type=text]{background:#101827;border:1px solid var(--border);color:var(--text);
  padding:9px 10px;border-radius:8px;font-size:.9rem;flex:1;min-width:140px;}
button{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#08101c;
  padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;}
button:hover{opacity:.9;}
.eta-list{display:grid;gap:10px;}
.eta-item{background:#141c2d;border-left:4px solid var(--accent);border-radius:10px;
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.eta-route{font-weight:700;font-size:1.05rem;}
.eta-dest{color:var(--muted);font-size:.78rem;}
.eta-min{font-size:1.3rem;font-weight:700;color:var(--accent2);white-space:nowrap;}
.eta-min.soon{color:var(--danger);}
.muted{color:var(--muted);font-size:.8rem;}
.stop-result{padding:8px 10px;border-radius:8px;background:#141c2d;margin-bottom:6px;
  cursor:pointer;font-size:.85rem;}
.stop-result:hover{background:#1e2a44;}
.toggle{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:20px;}
a{color:var(--accent);}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <h1>🚦 香港交通儀表板</h1>
  <p>HK Transport Dashboard · Data source: data.gov.hk</p>
</header>
<!-- Tab 按鈕：放在最前面 -->
<button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">⭐ 常用</button>

<!-- Tab 內容 -->
<div id="tab-dashboard" class="tab-content active">
  <div class="dash-header">
    <button class="btn-refresh" onclick="refreshDashboard()">🔄</button>
    <span id="dashUpdated" class="muted">未更新</span>
    <button class="btn-add" onclick="openAddFavModal()">＋ 新增</button>
  </div>
  <div id="dashList" class="dash-list">
    <p class="muted">未有常用項目，按「＋ 新增」開始</p>
  </div>
</div>

<!-- 新增常用 Modal -->
<div id="addFavModal" class="modal hidden">
  <div class="modal-box">
    <h3>新增常用</h3>
    <div class="fav-type-switch">
      <button class="fav-type-btn active" data-type="kmb-stop" onclick="setFavType('kmb-stop')">🚏 車站（全部路線）</button>
      <button class="fav-type-btn" data-type="kmb-route" onclick="setFavType('kmb-route')">🚌 九巴路線</button>
      <button class="fav-type-btn" data-type="gmb-route" onclick="setFavType('gmb-route')">🚐 小巴路線</button>
    </div>

    <!-- 車站模式 -->
    <div id="favForm-kmb-stop" class="fav-form">
      <label>站名關鍵字</label>
      <input type="text" id="favStopSearch" placeholder="例如：彩虹" oninput="searchKMBStopByName()">
      <div id="favStopResults" class="stop-result-list"></div>
    </div>

    <!-- 九巴路線模式 -->
    <div id="favForm-kmb-route" class="fav-form hidden">
      <label>路線號</label>
      <input type="text" id="favRouteInput" placeholder="例如：1A" oninput="searchKMBRouteDirs()">
      <div id="favRouteDirResults" class="stop-result-list"></div>
      <div id="favRouteStopResults" class="stop-result-list"></div>
    </div>

    <!-- 小巴路線模式 -->
    <div id="favForm-gmb-route" class="fav-form hidden">
      <p class="muted">請先喺「小巴」Tab 揀好路線／方向／站，再撳返嚟呢個 Modal 會自動帶入</p>
      <button onclick="prefillGMBFav()">帶入目前小巴選擇</button>
      <div id="favGMBPreview"></div>
    </div>

    <div class="fav-name-row">
      <label>顯示名稱（自訂）</label>
      <input type="text" id="favCustomName" placeholder="例如：屋企樓下、返工站">
    </div>

    <div class="modal-actions">
      <button onclick="confirmAddFav()" class="btn-primary">加入常用</button>
      <button onclick="closeAddFavModal()">取消</button>
    </div>
  </div>
</div>
<nav class="tabs">
  <button class="tab-btn active" data-tab="mtr" onclick="switchTab('mtr')">🚆 港鐵 MTR</button>
  <button class="tab-btn" data-tab="kmb" onclick="switchTab('kmb')">🚌 九巴 KMB</button>
  <button class="tab-btn" data-tab="ctb" onclick="switchTab('ctb')">🚍 城巴/NLB</button>
  <button class="tab-btn" data-tab="gmb" onclick="switchTab('gmb')">🚐 綠色小巴 GMB</button>
</nav>

<main>

  <!-- ================= MTR ================= -->
  <section id="tab-mtr" class="panel active">
    <div class="card">
      <div class="row">
        <select id="mtrLine"></select>
        <select id="mtrSta"></select>
        <button onclick="loadMTR()">查詢 Query</button>
      </div>
      <div class="row toggle">
        <label><input type="checkbox" id="mtrAuto" onchange="toggleAuto('mtr')"> 自動更新 (30s)</label>
        <span id="mtrUpdated" class="muted"></span>
      </div>
    </div>
    <div id="mtrResult" class="card"><p class="muted">請選擇路線及車站</p></div>
  </section>

  <!-- ================= KMB ================= -->
  <section id="tab-kmb" class="panel">
    <div class="card">
      <div class="row">
        <input type="text" id="kmbSearch" placeholder="搜尋巴士站名稱 e.g. 旺角">
        <button onclick="searchKMBStop()">搜尋</button>
      </div>
      <div id="kmbSearchResult"></div>
      <div class="row">
        <input type="text" id="kmbStopId" placeholder="或直接輸入 Stop ID">
        <button onclick="loadKMB()">查詢 ETA</button>
      </div>
      <div class="row toggle">
        <label><input type="checkbox" id="kmbAuto" onchange="toggleAuto('kmb')"> 自動更新 (30s)</label>
        <span id="kmbUpdated" class="muted"></span>
      </div>
    </div>
    <div id="kmbResult" class="card"><p class="muted">搜尋或輸入 Stop ID 查看到站時間</p></div>
  </section>

  <!-- ================= Citybus / NLB ================= -->
  <section id="tab-ctb" class="panel">
    <div class="card">
      <div class="row">
        <select id="ctbCo">
          <option value="CTB">城巴 Citybus</option>
          <option value="NLB">新大嶼山巴士 NLB</option>
        </select>
        <input type="text" id="ctbRoute" placeholder="路線號 e.g. 2 (只限CTB搜尋)">
        <select id="ctbDir">
          <option value="outbound">outbound</option>
          <option value="inbound">inbound</option>
        </select>
        <button onclick="searchCTBRoute()">搜尋站點</button>
      </div>
      <div id="ctbSearchResult"></div>
      <div class="row">
        <input type="text" id="ctbStopId" placeholder="或直接輸入 Stop ID">
        <button onclick="loadCTB()">查詢 ETA</button>
      </div>
      <div class="row toggle">
        <label><input type="checkbox" id="ctbAuto" onchange="toggleAuto('ctb')"> 自動更新 (30s)</label>
        <span id="ctbUpdated" class="muted"></span>
      </div>
    </div>
    <div id="ctbResult" class="card"><p class="muted">搜尋或輸入 Stop ID 查看到站時間</p></div>
  </section>

  <!-- ================= GMB ================= -->
  <section id="tab-gmb" class="panel">
    <div class="card">
      <div class="row">
        <select id="gmbRegion">
          <option value="HKI">香港島 HKI</option>
          <option value="KLN">九龍 KLN</option>
          <option value="NT">新界 NT</option>
        </select>
        <button onclick="loadGMBRoutes()">載入路線</button>
        <select id="gmbRoute"></select>
        <button onclick="loadGMBDirections()">選路線</button>
      </div>
      <div class="row">
        <select id="gmbDir"></select>
        <button onclick="loadGMBStops()">載入站點</button>
      </div>
      <div id="gmbStopResult"></div>
      <div class="row toggle">
        <label><input type="checkbox" id="gmbAuto" onchange="toggleAuto('gmb')"> 自動更新 (30s)</label>
        <span id="gmbUpdated" class="muted"></span>
      </div>
    </div>
    <div id="gmbResult" class="card"><p class="muted">請選擇地區、路線及站點</p></div>
  </section>

</main>

<footer>
  資料來源：<a href="https://data.gov.hk" target="_blank">data.gov.hk</a> · MTR / KMB / Citybus / GMB Open API<br>
  此網頁純前端運行，無需伺服器，可直接 Host 喺 GitHub Pages。
</footer>

<script>
/* ============ Tab 切換 ============ */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='tab-'+name));
}

/* ============ 自動更新 ============ */
const autoIntervals={};
function toggleAuto(name){
  const chk=document.getElementById(name+'Auto');
  if(chk.checked){
    autoIntervals[name]=setInterval(()=>{
      if(name==='mtr' && lastMTR) loadMTR();
      if(name==='kmb' && lastKMBStop) loadKMB();
      if(name==='ctb' && lastCTB) loadCTB();
      if(name==='gmb' && lastGMB!=null) selectGMBStop(lastGMB);
    }, 30000);
  } else {
    clearInterval(autoIntervals[name]);
  }
}

/* ============================================================
   MTR
   ============================================================ */
const MTR_LINES = {
  AEL:{name:"機場快線 Airport Express", stations:{HOK:"Hong Kong",KOW:"Kowloon",TSY:"Tsing Yi",AIR:"Airport",AWE:"AsiaWorld-Expo"}},
  TCL:{name:"東涌線 Tung Chung Line", stations:{HOK:"Hong Kong",KOW:"Kowloon",OLY:"Olympic",NAC:"Nam Cheong",LAK:"Lai King",MEF:"Mei Foo",TSY:"Tsing Yi",SUN:"Sunny Bay",TUC:"Tung Chung"}},
  TWL:{name:"荃灣線 Tsuen Wan Line", stations:{CEN:"Central",ADM:"Admiralty",TST:"Tsim Sha Tsui",JOR:"Jordan",YMT:"Yau Ma Tei",MOK:"Mong Kok",PRE:"Prince Edward",SSP:"Sham Shui Po",CSW:"Cheung Sha Wan",LCK:"Lai Chi Kok",MEF:"Mei Foo",LAK:"Lai King",KWF:"Kwai Fong",KWH:"Kwai Hing",TWH:"Tai Wo Hau",TSW:"Tsuen Wan"}},
  ISL:{name:"港島線 Island Line", stations:{KET:"Kennedy Town",HKU:"HKU",SYP:"Sai Ying Pun",SHW:"Sheung Wan",CEN:"Central",ADM:"Admiralty",WAC:"Wan Chai",CAB:"Causeway Bay",TIH:"Tin Hau",FOH:"Fortress Hill",NOP:"North Point",QUB:"Quarry Bay",TAK:"Tai Koo",SWH:"Sai Wan Ho",SKW:"Shau Kei Wan",HFC:"Heng Fa Chuen",CHW:"Chai Wan"}},
  KTL:{name:"觀塘線 Kwun Tong Line", stations:{WHA:"Whampoa",HOM:"Ho Man Tin",YMT:"Yau Ma Tei",MOK:"Mong Kok",PRE:"Prince Edward",SKM:"Shek Kip Mei",KOT:"Kowloon Tong",LOF:"Lok Fu",WTS:"Wong Tai Sin",DIH:"Diamond Hill",CHH:"Choi Hung",KOB:"Kowloon Bay",NTK:"Ngau Tau Kok",KWT:"Kwun Tong",LAT:"Lam Tin",YAT:"Yau Tong",TIK:"Tiu Keng Leng"}},
  SIL:{name:"南港島線 South Island Line", stations:{ADM:"Admiralty",OCP:"Ocean Park",WCH:"Wong Chuk Hang",LET:"Lei Tung",SOH:"South Horizons"}},
  TKL:{name:"將軍澳線 Tseung Kwan O Line", stations:{NOP:"North Point",QUB:"Quarry Bay",YAT:"Yau Tong",TIK:"Tiu Keng Leng",TKO:"Tseung Kwan O",LHP:"LOHAS Park",HAH:"Hang Hau",POA:"Po Lam"}},
  EAL:{name:"東鐵線 East Rail Line", stations:{ADM:"Admiralty",EXC:"Exhibition Centre",HUH:"Hung Hom",MKK:"Mong Kok East",TAW:"Tai Wai",SHT:"Sha Tin",FOT:"Fo Tan",RAC:"Racecourse",UNI:"University",TAP:"Tai Po Market",TWO:"Tai Wo",FAN:"Fanling",SHS:"Sheung Shui",LOW:"Lo Wu",LMC:"Lok Ma Chau"}},
  TML:{name:"屯馬線 Tuen Ma Line", stations:{WKS:"Wu Kai Sha",MOS:"Ma On Shan",HEO:"Heng On",TSH:"Tai Shui Hang",SHM:"Shek Mun",CIO:"City One",STW:"Sha Tin Wai",CKT:"Che Kung Temple",TAW:"Tai Wai",HIK:"Hin Keng",DIH:"Diamond Hill",KAT:"Kai Tak",SUW:"Sung Wong Toi",TKW:"To Kwa Wan",HOM:"Ho Man Tin",HUH:"Hung Hom",ETS:"East Tsim Sha Tsui",AUS:"Austin",NAC:"Nam Cheong",MEF:"Mei Foo",TWW:"Tsuen Wan West",KSR:"Kam Sheung Road",YUL:"Yuen Long",LOP:"Long Ping",TIS:"Tin Shui Wai",SIH:"Siu Hong",TUM:"Tuen Mun"}},
  DRL:{name:"迪士尼線 Disneyland Resort Line", stations:{SUN:"Sunny Bay",DIS:"Disneyland Resort"}}
};
// ⚠️ 如發現站碼有錯，請對照官方文件： https://opendata.mtr.com.hk/doc/Next_Train_API_Spec_v1.7.pdf

function initMTR(){
  const lineSel=document.getElementById('mtrLine');
  lineSel.innerHTML=Object.entries(MTR_LINES).map(([code,l])=>`<option value="${code}">${l.name}</option>`).join('');
  lineSel.onchange=populateMTRStations;
  populateMTRStations();
}
function populateMTRStations(){
  const line=document.getElementById('mtrLine').value;
  const staSel=document.getElementById('mtrSta');
  staSel.innerHTML=Object.entries(MTR_LINES[line].stations).map(([code,name])=>`<option value="${code}">${name}</option>`).join('');
}
let lastMTR=null;
async function loadMTR(){
  const line=document.getElementById('mtrLine').value;
  const sta=document.getElementById('mtrSta').value;
  lastMTR={line,sta};
  localStorage.setItem('mtrLine',line); localStorage.setItem('mtrSta',sta);
  const box=document.getElementById('mtrResult');
  box.innerHTML='<p class="muted"><span class="spin"></span> 載入中...</p>';
  try{
    const res=await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}&lang=zh`);
    const j=await res.json();
    if(j.status===0){ box.innerHTML=`<p class="muted">⚠️ ${j.message||'暫時未有班次資料 / 特別車務安排'}</p>`; return; }
    const key=`${line}-${sta}`;
    const d=j.data && j.data[key];
    if(!d){ box.innerHTML='<p class="muted">未有數據，此站可能不適用於該線路，或已收車。</p>'; return; }
    let html='';
    ['UP','DOWN'].forEach(dir=>{
      if(d[dir] && d[dir].length){
        html+=`<div style="margin-bottom:10px"><div class="muted" style="margin-bottom:6px">${dir==='UP'?'⬆ 上行':'⬇ 下行'}</div><div class="eta-list">`;
        d[dir].forEach(t=>{
          const mins=(t.ttnt!==undefined)? `${t.ttnt} 分鐘` : t.time;
          const soon = t.ttnt!==undefined && Number(t.ttnt)<=2;
          html+=`<div class="eta-item"><div><div class="eta-route">往 ${t.dest}</div><div class="eta-dest">月台 ${t.plat} ・ ${t.time}</div></div><div class="eta-min ${soon?'soon':''}">${mins}</div></div>`;
        });
        html+='</div></div>';
      }
    });
    box.innerHTML = html || '<p class="muted">暫時未有班次資料</p>';
    document.getElementById('mtrUpdated').textContent='更新於 '+new Date().toLocaleTimeString();
  }catch(e){ box.innerHTML=`<p class="muted">❌ 讀取失敗: ${e.message}</p>`; }
}

/* ============================================================
   KMB
   ============================================================ */
let kmbStopsCache=null;
async function searchKMBStop(){
  const kw=document.getElementById('kmbSearch').value.trim();
  const box=document.getElementById('kmbSearchResult');
  if(!kw) return;
  box.innerHTML='<p class="muted"><span class="spin"></span> 搜尋中...</p>';
  try{
    if(!kmbStopsCache){
      const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
      const j=await r.json();
      kmbStopsCache=j.data;
    }
    const matches=kmbStopsCache.filter(s=>
      (s.name_tc && s.name_tc.includes(kw)) || (s.name_en && s.name_en.toLowerCase().includes(kw.toLowerCase()))
    ).slice(0,20);
    if(!matches.length){ box.innerHTML='<p class="muted">找不到相關巴士站</p>'; return; }
    box.innerHTML=matches.map(s=>
      `<div class="stop-result" onclick="selectKMBStop('${s.stop}','${(s.name_tc||'').replace(/'/g,"\\'")}')">${s.name_tc} (${s.name_en}) — ${s.stop}</div>`
    ).join('');
  }catch(e){ box.innerHTML=`<p class="muted">❌ ${e.message}</p>`; }
}
function selectKMBStop(id,name){
  document.getElementById('kmbStopId').value=id;
  document.getElementById('kmbSearchResult').innerHTML=`<p class="muted">已選擇：${name}</p>`;
  loadKMB();
}
let lastKMBStop=null;
async function loadKMB(){
  const stopId=document.getElementById('kmbStopId').value.trim();
  if(!stopId) return;
  lastKMBStop=stopId;
  localStorage.setItem('kmbStopId',stopId);
  const box=document.getElementById('kmbResult');
  box.innerHTML='<p class="muted"><span class="spin"></span> 載入中...</p>';
  try{
    const r=await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
    const j=await r.json();
    const list=(j.data||[]).filter(x=>x.eta);
    if(!list.length){ box.innerHTML='<p class="muted">暫時未有班次 / 此站可能已收班</p>'; return; }
    list.sort((a,b)=>new Date(a.eta)-new Date(b.eta));
    box.innerHTML='<div class="eta-list">'+list.map(x=>{
      const mins=Math.round((new Date(x.eta)-new Date())/60000);

/* ============================================================
   GMB (綠色專線小巴) — 強化版：自動嘗試多個可能 API 格式
   ============================================================ */

// 安全 fetch：檢查 content-type，避免 HTML 錯誤頁當 JSON parse
async function fetchJsonSafe(url){
  const res = await fetch(url);
  const ct = res.headers.get('content-type') || '';
  if(!res.ok || !ct.includes('json')){
    throw new Error(`HTTP ${res.status} @ ${url}`);
  }
  return res.json();
}

// 逐個試 URL，成功即用，全部失敗先拋錯（附完整錯誤列表）
async function tryEndpoints(urls){
  const errors=[];
  for(const url of urls){
    try{
      const json = await fetchJsonSafe(url);
      console.log('✅ 成功:', url);
      console.log('回應內容:', JSON.stringify(json, null, 2));
      return {url, json};
    }catch(e){
      console.warn('✗ 失敗:', url, '-', e.message);
      errors.push(`${url} → ${e.message}`);
    }
  }
  throw new Error('全部 API 格式都失敗:\n' + errors.join('\n'));
}

// 深層搜尋：喺任何嵌套結構入面搵出「含有指定 key 嘅物件陣列」
function deepFindArray(obj, key, seen = new Set()){
  if(!obj || typeof obj !== 'object') return null;
  if(seen.has(obj)) return null;
  seen.add(obj);
  if(Array.isArray(obj)){
    if(obj.length && obj.some(it => it && typeof it === 'object' && key in it)) return obj;
    for(const item of obj){
      const found = deepFindArray(item, key, seen);
      if(found) return found;
    }
    return null;
  }
  for(const k in obj){
    const found = deepFindArray(obj[k], key, seen);
    if(found) return found;
  }
  return null;
}

// 猜測物件裡面最似「名稱/目的地」嘅欄位
function guessLabel(obj){
  if(!obj || typeof obj !== 'object') return null;
  const keys = Object.keys(obj);
  const tcKey = keys.find(k => /dest.*tc|tc.*dest/i.test(k)) || keys.find(k => /name.*tc/i.test(k));
  if(tcKey && obj[tcKey]) return obj[tcKey];
  const enKey = keys.find(k => /dest.*en|name.*en/i.test(k));
  if(enKey && obj[enKey]) return obj[enKey];
  return null;
}

let gmbState = {};

async function loadGMBRoutes(){
  const region = document.getElementById('gmbRegion').value;
  const sel = document.getElementById('gmbRoute');
  sel.innerHTML = '<option>載入中...</option>';
  try{
    const {json} = await tryEndpoints([
      `https://data.etagmb.gov.hk/route/${region}`
    ]);
    let routesArr = deepFindArray(json, 'route_id');
    let codes;
    if(routesArr){
      codes = [...new Set(routesArr.map(r => r.route_code || r.route || r.name))].filter(Boolean);
    } else {
      const raw = json.data;
      codes = Array.isArray(raw) ? raw : (raw && raw.routes) || [];
    }
    if(!codes.length){ sel.innerHTML = '<option>找不到路線</option>'; return; }
    sel.innerHTML = codes.map(c => `<option value="${c}">${c}</option>`).join('');
  }catch(e){
    sel.innerHTML = '<option>載入失敗</option>';
    console.error(e);
    alert('載入路線失敗，請打開 Console (F12) 查看詳情：\n' + e.message);
  }
}

async function loadGMBDirections(){
  const region = document.getElementById('gmbRegion').value;
  const route = document.getElementById('gmbRoute').value;
  const dirSel = document.getElementById('gmbDir');
  dirSel.innerHTML = '<option>載入中...</option>';
  try{
    const {json} = await tryEndpoints([
      `https://data.etagmb.gov.hk/route/${region}/${route}`
    ]);
    const dirs = deepFindArray(json, 'route_id');
    if(!dirs || !dirs.length){
      dirSel.innerHTML = '<option>找不到方向資料</option>';
      console.warn('搵唔到 route_id 陣列，完整回應見上面 log');
      return;
    }
    gmbState.directions = dirs;
    dirSel.innerHTML = dirs.map((d, i) => {
      const label = guessLabel(d) || `方向 ${d.route_seq ?? d.direction ?? (i+1)}`;
      return `<option value="${i}">${label} (route_id:${d.route_id})</option>`;
    }).join('');
  }catch(e){
    dirSel.innerHTML = '<option>載入失敗</option>';
    console.error(e);
    alert('載入方向失敗：\n' + e.message);
  }
}

async function loadGMBStops(){
  const box = document.getElementById('gmbStopResult');
  const dirIdx = Number(document.getElementById('gmbDir').value);
  const dirObj = gmbState.directions?.[dirIdx];
  if(!dirObj){ box.innerHTML = '<p class="muted">請先選擇方向</p>'; return; }

  const routeId = dirObj.route_id;
  const routeSeq = dirObj.route_seq ?? dirObj.direction ?? (dirIdx + 1);
  const serviceType = dirObj.service_type ?? 1;
  gmbState.routeId = routeId;
  gmbState.routeSeq = routeSeq;
  gmbState.serviceType = serviceType;

  box.innerHTML = '<p class="muted"><span class="spin"></span> 載入站點中...</p>';
  try{
    // 依次試幾種可能格式（修正：先試「無 service_type」嘅正確格式）
    const {json} = await tryEndpoints([
      `https://data.etagmb.gov.hk/route-stop/${routeId}/${routeSeq}`,
      `https://data.etagmb.gov.hk/route-stop/${routeId}`,
      `https://data.etagmb.gov.hk/route-stop/${routeId}/${routeSeq}/${serviceType}`
    ]);
    const stops = deepFindArray(json, 'stop_seq') || deepFindArray(json, 'stop_id');
    if(!stops || !stops.length){
      box.innerHTML = '<p class="muted">找不到站點資料，請查看 Console 完整回應</p>';
      return;
    }
    // 嘗試攞站名，如冇就逐個 call /stop/{stop_id}
    const withNames = await Promise.all(stops.map(async s => {
      let name = guessLabel(s);
      if(!name && s.stop_id){
        try{
          const r = await fetch(`https://data.etagmb.gov.hk/stop/${s.stop_id}`);
          const j2 = await r.json();
          const stopObj = deepFindArray(j2, 'stop_id')?.[0] || j2.data || j2;
          name = guessLabel(stopObj) || s.stop_id;
        }catch{ name = s.stop_id; }
      }
      return {...s, _name: name || s.stop_id || ('站 ' + s.stop_seq)};
    }));
    gmbState.stops = withNames;
    box.innerHTML = withNames.map(s =>
      `<div class="stop-result" onclick="selectGMBStop(${s.stop_seq})">${s.stop_seq}. ${s._name}</div>`
    ).join('');
  }catch(e){
    box.innerHTML = `<p class="muted">❌ ${e.message}</p>`;
    console.error(e);
  }
}

async function selectGMBStop(stopSeq){
  lastGMB = stopSeq;
  const box = document.getElementById('gmbResult');
  box.innerHTML = '<p class="muted"><span class="spin"></span> 載入 ETA 中...</p>';
  const {routeId, routeSeq, serviceType} = gmbState;
  try{
    const {json} = await tryEndpoints([
      `https://data.etagmb.gov.hk/eta/route-stop/${routeId}/${stopSeq}/${routeSeq}`,
      `https://data.etagmb.gov.hk/eta/route-stop/${routeId}/${stopSeq}`,
      `https://data.etagmb.gov.hk/eta/route-stop/${routeId}/${stopSeq}/${serviceType}`
    ]);
    const etas = deepFindArray(json, 'eta') || deepFindArray(json, 'timestamp') || deepFindArray(json, 'diff');
    if(!etas || !etas.length){
      box.innerHTML = '<p class="muted">暫時未有班次資料</p>';
      return;
    }
    box.innerHTML = '<div class="eta-list">' + etas.map(x => {

      let mins = '-';
      if(t){ mins = Math.round((new Date(t) - new Date()) / 60000); }
      else if(x.diff != null){ mins = Math.round(x.diff / 60); }
      return `<div class="eta-item"><div class="eta-route">小巴 (座位 ${x.enroute_stop_seq ?? '-'})</div><div class="eta-min ${mins!=='-' && mins<=2?'soon':''}">${mins==='-'?'-':(mins<=0?'即將到達':mins+' 分鐘')}</div></div>`;
    }).join('') + '</div>';
    document.getElementById('gmbUpdated').textContent = '更新於 ' + new Date().toLocaleTimeString();
  }catch(e){
    box.innerHTML = `<p class="muted">❌ ${e.message}</p>`;
    console.error(e);
  }
}

async function refreshDashboard(){
  const favs = getFavourites();
  const list = document.getElementById('dashList');
  if(!favs.length){
    list.innerHTML = '<p class="muted">未有常用項目，按「＋ 新增」開始</p>';
    return;

  list.innerHTML = favs.map(f => `

      </div>
      <div class="dash-body" id="fav-body-${f.id}"><p class="muted"><span class="spin"></span> 載入中...</p></div>
    </div>
  `).join('');

  await Promise.all(favs.map(f => loadFavEta(f)));
  document.getElementById('dashUpdated').textContent = '更新於 ' + new Date().toLocaleTimeString();
}

async function loadFavEta(f){
  const body = document.getElementById(`fav-body-${f.id}`);
  try{
    if(f.type === 'kmb-stop'){
      const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${f.stopId}`);
      const json = await res.json();
      const rows = (json.data || []).filter(r => r.eta);
      // 每條路線+方向 揀最快嗰班
      const grouped = {};
      rows.forEach(r => {
        const key = r.route + '_' + r.dir;
        if(!grouped[key] || new Date(r.eta) < new Date(grouped[key].eta)) grouped[key] = r;
      });
      const sorted = Object.values(grouped).sort((a,b) => new Date(a.eta) - new Date(b.eta));
      renderEtaRows(body, sorted.map(r => ({
        route: r.route, dest: r.dest_ch, eta: r.eta
      })));
    }
    else if(f.type === 'kmb-route'){
      const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${f.stopId}/${f.route}/${f.serviceType}`);
      const json = await res.json();
      const rows = (json.data || []).filter(r => r.eta && r.dir === f.dir);
      renderEtaRows(body, rows.map(r => ({ route: r.route, dest: r.dest_ch, eta: r.eta })));
    }
    else if(f.type === 'gmb-route'){
      const res = await fetch(`https://data.etagmb.gov.hk/eta/route-stop/${f.routeId}/${f.stopSeq}/${f.routeSeq}`);
      const json = await res.json();
      const etas = (json.data?.[0]?.enroute || json.data || []);
      const flat = Array.isArray(etas) ? etas.flatMap(x => x.eta || [x]) : [];
      renderEtaRows(body, flat.map(x => ({ route: f.route, dest: f.dest, eta: x.timestamp || x.eta })));
    }
  }catch(e){
    body.innerHTML = `<p class="muted">❌ 載入失敗</p>`;
    console.error(f.name, e);
  }
}

function renderEtaRows(body, rows){
  if(!rows.length){ body.innerHTML = '<p class="muted">暫無班次資料</p>'; return; }
  rows.sort((a,b) => new Date(a.eta) - new Date(b.eta));
  body.innerHTML = rows.slice(0, 5).map(r => {
    const mins = Math.round((new Date(r.eta) - new Date()) / 60000);
    const cls = mins <= 2 ? 'soon' : (mins <= 5 ? 'warn' : '');
    const minText = mins <= 0 ? '即將到達' : mins + ' 分';
    return `
      <div class="dash-eta-row">
        <div>
          <span class="dash-eta-route">${r.route}</span>
          <div class="dash-eta-dest">往 ${r.dest || ''}</div>
        </div>
        <div class="dash-eta-min ${cls}">${minText}</div>
      </div>`;
  }).join('');
}
