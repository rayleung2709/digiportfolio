<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚦 香港交通儀表板 HK Transport Dashboard</title>
<style>
:root{
  --bg:#0f1420; --card:#1b2333; --accent:#00d4ff; --accent2:#7cffb2;
  --text:#e6ecf5; --muted:#8a94a6; --danger:#ff5f6d; --border:#263252;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI','Noto Sans TC',sans-serif;
  background:linear-gradient(160deg,#0f1420,#141b2d 60%,#1a2238);
  color:var(--text);min-height:100vh;}
header{padding:24px 16px 8px;text-align:center;}
header h1{margin:0;font-size:1.6rem;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
header p{color:var(--muted);margin:4px 0 0;font-size:.85rem;}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px auto;padding:0 12px;}
.tab-btn{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:999px;cursor:pointer;font-size:.9rem;transition:.2s;}
.tab-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#08101c;font-weight:600;border-color:transparent;}
main{max-width:900px;margin:0 auto;padding:0 16px 60px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
select,input[type=text]{background:#101827;border:1px solid var(--border);color:var(--text);
  padding:9px 10px;border-radius:8px;font-size:.9rem;flex:1;min-width:140px;}
button{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#08101c;
  padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;}
button:hover{opacity:.9;}
.eta-list{display:grid;gap:10px;}
.eta-item{background:#141c2d;border-left:4px solid var(--accent);border-radius:10px;
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.eta-route{font-weight:700;font-size:1.05rem;}
.eta-dest{color:var(--muted);font-size:.78rem;}
.eta-min{font-size:1.3rem;font-weight:700;color:var(--accent2);white-space:nowrap;}
.eta-min.soon{color:var(--danger);}
.muted{color:var(--muted);font-size:.8rem;}
.stop-result{padding:8px 10px;border-radius:8px;background:#141c2d;margin-bottom:6px;
  cursor:pointer;font-size:.85rem;}
.stop-result:hover{background:#1e2a44;}
.toggle{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:20px;}
a{color:var(--accent);}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <h1>🚦 香港交通儀表板</h1>
  <p>HK Transport Dashboard · Data source: data.gov.hk</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="mtr" onclick="switchTab('mtr')">🚆 港鐵 MTR</button>
  <button class="tab-btn" data-tab="kmb" onclick="switchTab('kmb')">🚌 九巴 KMB</button>
  <button class="tab-btn" data-tab="ctb" onclick="switchTab('ctb')">🚍 城巴/NLB</button>
  <button class="tab-btn" data-tab="gmb" onclick="switchTab('gmb')">🚐 綠色小巴 GMB</button>
</nav>

<main>

  <!-- ================= MTR ================= -->
  <section id="tab-mtr" class="panel active">
    <div class="card">
      <div class="row">
        <select id="mtrLine"></select>
        <select id="mtrSta"></select>
        <button onclick="loadMTR()">查詢 Query</button>
      </div>
      <div class="row toggle">
        <label><input type="checkbox" id="mtrAuto" onchange="toggleAuto('mtr')"> 自動更新 (30s)</label>
        <span id="mtrUpdated" class="muted"></span>
      </div>
    </div>
    <div id="mtrResult" class="card"><p class="muted">請選擇路線及車站</p></div>
  </section>

  <!-- ================= KMB ================= -->
  <section id="tab-kmb" class="panel">
    <div class="card">
      <div class="row">
        <input type="text" id="kmbSearch" placeholder="搜尋巴士站名稱 e.g. 旺角">
        <button onclick="searchKMBStop()">搜尋</button>
      </div>
      <div id="kmbSearchResult"></div>
      <div class="row">
        <input type="text" id="kmbStopId" placeholder="或直接輸入 Stop ID">
        <button onclick="loadKMB()">查詢 ETA</button>
      </div>
      <div class="row toggle">
        <label><input type="checkbox" id="kmbAuto" onchange="toggleAuto('kmb')"> 自動更新 (30s)</label>
        <span id="kmbUpdated" class="muted"></span>
      </div>
    </div>
    <div id="kmbResult" class="card"><p class="muted">搜尋或輸入 Stop ID 查看到站時間</p></div>
  </section>

  <!-- ================= Citybus / NLB ================= -->
  <section id="tab-ctb" class="panel">
    <div class="card">
      <div class="row">
        <select id="ctbCo">
          <option value="CTB">城巴 Citybus</option>
          <option value="NLB">新大嶼山巴士 NLB</option>
        </select>
        <input type="text" id="ctbRoute" placeholder="路線號 e.g. 2 (只限CTB搜尋)">
        <select id="ctbDir">
          <option value="outbound">outbound</option>
          <option value="inbound">inbound</option>
        </select>
        <button onclick="searchCTBRoute()">搜尋站點</button>
      </div>
      <div id="ctbSearchResult"></div>
      <div class="row">
        <input type="text" id="ctbStopId" placeholder="或直接輸入 Stop ID">
        <button onclick="loadCTB()">查詢 ETA</button>
      </div>
      <div class="row toggle">
        <label><input type="checkbox" id="ctbAuto" onchange="toggleAuto('ctb')"> 自動更新 (30s)</label>
        <span id="ctbUpdated" class="muted"></span>
      </div>
    </div>
    <div id="ctbResult" class="card"><p class="muted">搜尋或輸入 Stop ID 查看到站時間</p></div>
  </section>

  <!-- ================= GMB ================= -->
  <section id="tab-gmb" class="panel">
    <div class="card">
      <div class="row">
        <select id="gmbRegion">
          <option value="HKI">香港島 HKI</option>
          <option value="KLN">九龍 KLN</option>
          <option value="NT">新界 NT</option>
        </select>
        <button onclick="loadGMBRoutes()">載入路線</button>
        <select id="gmbRoute"></select>
        <button onclick="loadGMBDirections()">選路線</button>
      </div>
      <div class="row">
        <select id="gmbDir"></select>
        <button onclick="loadGMBStops()">載入站點</button>
      </div>
      <div id="gmbStopResult"></div>
      <div class="row toggle">
        <label><input type="checkbox" id="gmbAuto" onchange="toggleAuto('gmb')"> 自動更新 (30s)</label>
        <span id="gmbUpdated" class="muted"></span>
      </div>
    </div>
    <div id="gmbResult" class="card"><p class="muted">請選擇地區、路線及站點</p></div>
  </section>

</main>

<footer>
  資料來源：<a href="https://data.gov.hk" target="_blank">data.gov.hk</a> · MTR / KMB / Citybus / GMB Open API<br>
  此網頁純前端運行，無需伺服器，可直接 Host 喺 GitHub Pages。
</footer>

<script>
/* ============ Tab 切換 ============ */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='tab-'+name));
}

/* ============ 自動更新 ============ */
const autoIntervals={};
function toggleAuto(name){
  const chk=document.getElementById(name+'Auto');
  if(chk.checked){
    autoIntervals[name]=setInterval(()=>{
      if(name==='mtr' && lastMTR) loadMTR();
      if(name==='kmb' && lastKMBStop) loadKMB();
      if(name==='ctb' && lastCTB) loadCTB();
      if(name==='gmb' && lastGMB!=null) selectGMBStop(lastGMB);
    }, 30000);
  } else {
    clearInterval(autoIntervals[name]);
  }
}

/* ============================================================
   MTR
   ============================================================ */
const MTR_LINES = {
  AEL:{name:"機場快線 Airport Express", stations:{HOK:"Hong Kong",KOW:"Kowloon",TSY:"Tsing Yi",AIR:"Airport",AWE:"AsiaWorld-Expo"}},
  TCL:{name:"東涌線 Tung Chung Line", stations:{HOK:"Hong Kong",KOW:"Kowloon",OLY:"Olympic",NAC:"Nam Cheong",LAK:"Lai King",MEF:"Mei Foo",TSY:"Tsing Yi",SUN:"Sunny Bay",TUC:"Tung Chung"}},
  TWL:{name:"荃灣線 Tsuen Wan Line", stations:{CEN:"Central",ADM:"Admiralty",TST:"Tsim Sha Tsui",JOR:"Jordan",YMT:"Yau Ma Tei",MOK:"Mong Kok",PRE:"Prince Edward",SSP:"Sham Shui Po",CSW:"Cheung Sha Wan",LCK:"Lai Chi Kok",MEF:"Mei Foo",LAK:"Lai King",KWF:"Kwai Fong",KWH:"Kwai Hing",TWH:"Tai Wo Hau",TSW:"Tsuen Wan"}},
  ISL:{name:"港島線 Island Line", stations:{KET:"Kennedy Town",HKU:"HKU",SYP:"Sai Ying Pun",SHW:"Sheung Wan",CEN:"Central",ADM:"Admiralty",WAC:"Wan Chai",CAB:"Causeway Bay",TIH:"Tin Hau",FOH:"Fortress Hill",NOP:"North Point",QUB:"Quarry Bay",TAK:"Tai Koo",SWH:"Sai Wan Ho",SKW:"Shau Kei Wan",HFC:"Heng Fa Chuen",CHW:"Chai Wan"}},
  KTL:{name:"觀塘線 Kwun Tong Line", stations:{WHA:"Whampoa",HOM:"Ho Man Tin",YMT:"Yau Ma Tei",MOK:"Mong Kok",PRE:"Prince Edward",SKM:"Shek Kip Mei",KOT:"Kowloon Tong",LOF:"Lok Fu",WTS:"Wong Tai Sin",DIH:"Diamond Hill",CHH:"Choi Hung",KOB:"Kowloon Bay",NTK:"Ngau Tau Kok",KWT:"Kwun Tong",LAT:"Lam Tin",YAT:"Yau Tong",TIK:"Tiu Keng Leng"}},
  SIL:{name:"南港島線 South Island Line", stations:{ADM:"Admiralty",OCP:"Ocean Park",WCH:"Wong Chuk Hang",LET:"Lei Tung",SOH:"South Horizons"}},
  TKL:{name:"將軍澳線 Tseung Kwan O Line", stations:{NOP:"North Point",QUB:"Quarry Bay",YAT:"Yau Tong",TIK:"Tiu Keng Leng",TKO:"Tseung Kwan O",LHP:"LOHAS Park",HAH:"Hang Hau",POA:"Po Lam"}},
  EAL:{name:"東鐵線 East Rail Line", stations:{ADM:"Admiralty",EXC:"Exhibition Centre",HUH:"Hung Hom",MKK:"Mong Kok East",TAW:"Tai Wai",SHT:"Sha Tin",FOT:"Fo Tan",RAC:"Racecourse",UNI:"University",TAP:"Tai Po Market",TWO:"Tai Wo",FAN:"Fanling",SHS:"Sheung Shui",LOW:"Lo Wu",LMC:"Lok Ma Chau"}},
  TML:{name:"屯馬線 Tuen Ma Line", stations:{WKS:"Wu Kai Sha",MOS:"Ma On Shan",HEO:"Heng On",TSH:"Tai Shui Hang",SHM:"Shek Mun",CIO:"City One",STW:"Sha Tin Wai",CKT:"Che Kung Temple",TAW:"Tai Wai",HIK:"Hin Keng",DIH:"Diamond Hill",KAT:"Kai Tak",SUW:"Sung Wong Toi",TKW:"To Kwa Wan",HOM:"Ho Man Tin",HUH:"Hung Hom",ETS:"East Tsim Sha Tsui",AUS:"Austin",NAC:"Nam Cheong",MEF:"Mei Foo",TWW:"Tsuen Wan West",KSR:"Kam Sheung Road",YUL:"Yuen Long",LOP:"Long Ping",TIS:"Tin Shui Wai",SIH:"Siu Hong",TUM:"Tuen Mun"}},
  DRL:{name:"迪士尼線 Disneyland Resort Line", stations:{SUN:"Sunny Bay",DIS:"Disneyland Resort"}}
};
// ⚠️ 如發現站碼有錯，請對照官方文件： https://opendata.mtr.com.hk/doc/Next_Train_API_Spec_v1.7.pdf

function initMTR(){
  const lineSel=document.getElementById('mtrLine');
  lineSel.innerHTML=Object.entries(MTR_LINES).map(([code,l])=>`<option value="${code}">${l.name}</option>`).join('');
  lineSel.onchange=populateMTRStations;
  populateMTRStations();
}
function populateMTRStations(){
  const line=document.getElementById('mtrLine').value;
  const staSel=document.getElementById('mtrSta');
  staSel.innerHTML=Object.entries(MTR_LINES[line].stations).map(([code,name])=>`<option value="${code}">${name}</option>`).join('');
}
let lastMTR=null;
async function loadMTR(){
  const line=document.getElementById('mtrLine').value;
  const sta=document.getElementById('mtrSta').value;
  lastMTR={line,sta};
  localStorage.setItem('mtrLine',line); localStorage.setItem('mtrSta',sta);
  const box=document.getElementById('mtrResult');
  box.innerHTML='<p class="muted"><span class="spin"></span> 載入中...</p>';
  try{
    const res=await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}&lang=zh`);
    const j=await res.json();
    if(j.status===0){ box.innerHTML=`<p class="muted">⚠️ ${j.message||'暫時未有班次資料 / 特別車務安排'}</p>`; return; }
    const key=`${line}-${sta}`;
    const d=j.data && j.data[key];
    if(!d){ box.innerHTML='<p class="muted">未有數據，此站可能不適用於該線路，或已收車。</p>'; return; }
    let html='';
    ['UP','DOWN'].forEach(dir=>{
      if(d[dir] && d[dir].length){
        html+=`<div style="margin-bottom:10px"><div class="muted" style="margin-bottom:6px">${dir==='UP'?'⬆ 上行':'⬇ 下行'}</div><div class="eta-list">`;
        d[dir].forEach(t=>{
          const mins=(t.ttnt!==undefined)? `${t.ttnt} 分鐘` : t.time;
          const soon = t.ttnt!==undefined && Number(t.ttnt)<=2;
          html+=`<div class="eta-item"><div><div class="eta-route">往 ${t.dest}</div><div class="eta-dest">月台 ${t.plat} ・ ${t.time}</div></div><div class="eta-min ${soon?'soon':''}">${mins}</div></div>`;
        });
        html+='</div></div>';
      }
    });
    box.innerHTML = html || '<p class="muted">暫時未有班次資料</p>';
    document.getElementById('mtrUpdated').textContent='更新於 '+new Date().toLocaleTimeString();
  }catch(e){ box.innerHTML=`<p class="muted">❌ 讀取失敗: ${e.message}</p>`; }
}

/* ============================================================
   KMB
   ============================================================ */
let kmbStopsCache=null;
async function searchKMBStop(){
  const kw=document.getElementById('kmbSearch').value.trim();
  const box=document.getElementById('kmbSearchResult');
  if(!kw) return;
  box.innerHTML='<p class="muted"><span class="spin"></span> 搜尋中...</p>';
  try{
    if(!kmbStopsCache){
      const r=await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
      const j=await r.json();
      kmbStopsCache=j.data;
    }
    const matches=kmbStopsCache.filter(s=>
      (s.name_tc && s.name_tc.includes(kw)) || (s.name_en && s.name_en.toLowerCase().includes(kw.toLowerCase()))
    ).slice(0,20);
    if(!matches.length){ box.innerHTML='<p class="muted">找不到相關巴士站</p>'; return; }
    box.innerHTML=matches.map(s=>
      `<div class="stop-result" onclick="selectKMBStop('${s.stop}','${(s.name_tc||'').replace(/'/g,"\\'")}')">${s.name_tc} (${s.name_en}) — ${s.stop}</div>`
    ).join('');
  }catch(e){ box.innerHTML=`<p class="muted">❌ ${e.message}</p>`; }
}
function selectKMBStop(id,name){
  document.getElementById('kmbStopId').value=id;
  document.getElementById('kmbSearchResult').innerHTML=`<p class="muted">已選擇：${name}</p>`;
  loadKMB();
}
let lastKMBStop=null;
async function loadKMB(){
  const stopId=document.getElementById('kmbStopId').value.trim();
  if(!stopId) return;
  lastKMBStop=stopId;
  localStorage.setItem('kmbStopId',stopId);
  const box=document.getElementById('kmbResult');
  box.innerHTML='<p class="muted"><span class="spin"></span> 載入中...</p>';
  try{
    const r=await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
    const j=await r.json();
    const list=(j.data||[]).filter(x=>x.eta);
    if(!list.length){ box.innerHTML='<p class="muted">暫時未有班次 / 此站可能已收班</p>'; return; }
    list.sort((a,b)=>new Date(a.eta)-new Date(b.eta));
    box.innerHTML='<div class="eta-list">'+list.map(x=>{
      const mins=Math.round((new Date(x.eta)-new Date())/60000);
      return `<div class="eta-item"><div><div class="eta-route">${x.route} (${x.dir==='O'?'outbound':'inbound'})</div><div class="eta-dest">往 ${x.dest_tc||x.dest_en}</div></div><div class="eta-min ${mins<=2?'soon':''}">${mins<=0?'即將到達':mins+' 分鐘'}</div></div>`;
    }).join('')+'</div>';
    document.getElementById('kmbUpdated').textContent='更新於 '+new Date().toLocaleTimeString();
  }catch(e){ box.innerHTML=`<p class="muted">❌ ${e.message}</p>`; }
}

/* ============================================================
   Citybus (CTB) / NLB — 統一用 rt.data.gov.hk batch API 攞 ETA
   路線搜尋用 Citybus 專屬 v2 API
   ============================================================ */
async function searchCTBRoute(){
  const route=document.getElementById('ctbRoute').value.trim();
  const dir=document.getElementById('ctbDir').value;
  const box=document.getElementById('ctbSearchResult');
  if(!route){ box.innerHTML='<p class="muted">請輸入路線號</p>'; return; }
  box.innerHTML='<p class="muted"><span class="spin"></span> 搜尋中...</p>';
  try{
    const r=await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`);
    const j=await r.json();
    const stops=j.data||[];
    if(!stops.length){ box.innerHTML='<p class="muted">找不到此路線站點，請檢查路線號 / 方向</p>'; return; }
    const withNames=await Promise.all(stops.map(async s=>{
      try{
        const rr=await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`);
        const jj=await rr.json();
        return {...s, name: jj.data ? jj.data.name_tc : s.stop};
      }catch{ return {...s, name:s.stop}; }
    }));
    box.innerHTML=withNames.map(s=>
      `<div class="stop-result" onclick="selectCTBStop('${s.stop}','${(s.name||'').replace(/'/g,"\\'")}')">${s.seq}. ${s.name} — ${s.stop}</div>`
    ).join('');
  }catch(e){ box.innerHTML=`<p class="muted">❌ ${e.message}</p>`; }
}
function selectCTBStop(stopId,name){
  document.getElementById('ctbStopId').value=stopId;
  document.getElementById('ctbSearchResult').innerHTML=`<p class="muted">已選擇：${name}</p>`;
  loadCTB();
}
let lastCTB=null;
async function loadCTB(){
  const co=document.getElementById('ctbCo').value;
  const stopId=document.getElementById('ctbStopId').value.trim();
  if(!stopId) return;
  lastCTB={co,stopId};
  localStorage.setItem('ctbCo',co); localStorage.setItem('ctbStopId',stopId);
  const box=document.getElementById('ctbResult');
  box.innerHTML='<p class="muted"><span class="spin"></span> 載入中...</p>';
  try{
    const r=await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta/${co}/${stopId}`);
    const j=await r.json();
    const list=(j.data||[]).filter(x=>x.eta);
    if(!list.length){ box.innerHTML='<p class="muted">暫時未有班次資料</p>'; return; }
    list.sort((a,b)=>new Date(a.eta)-new Date(b.eta));
    box.innerHTML='<div class="eta-list">'+list.map(x=>{
      const mins=Math.round((new Date(x.eta)-new Date())/60000);
      return `<div class="eta-item"><div><div class="eta-route">${x.route} (${x.dir})</div><div class="eta-dest">往 ${x.dest||''}</div></div><div class="eta-min ${mins<=2?'soon':''}">${mins<=0?'即將到達':mins+' 分鐘'}</div></div>`;
    }).join('')+'</div>';
    document.getElementById('ctbUpdated').textContent='更新於 '+new Date().toLocaleTimeString();
  }catch(e){ box.innerHTML=`<p class="muted">❌ ${e.message}</p>`; }
}

/* ============================================================
   GMB (綠色專線小巴)
   ⚠️ GMB API 結構比較複雜，以下係best-effort寫法。
   如果實際回應格式對唔上，請打開瀏覽器 DevTools > Console/Network
   睇返實際 JSON structure 再微調 (呢個先係"vibe coding"精髓😄)
   ============================================================ */
let gmbState={};
async function loadGMBRoutes(){
  const region=document.getElementById('gmbRegion').value;
  const sel=document.getElementById('gmbRoute');
  sel.innerHTML='<option>載入中...</option>';
  try{
    const r=await fetch(`https://data.etagmb.gov.hk/route/${region}`);
    const j=await r.json();
    console.log('GMB routes raw:', j);
    const routes=(j.data && j.data.routes) || j.data || [];
    sel.innerHTML=routes.map(rt=>`<option value="${rt}">${rt}</option>`).join('');
  }catch(e){ sel.innerHTML='<option>載入失敗</option>'; console.error(e); }
}
async function loadGMBDirections(){
  const region=document.getElementById('gmbRegion').value;
  const route=document.getElementById('gmbRoute').value;
  const dirSel=document.getElementById('gmbDir');
  dirSel.innerHTML='<option>載入中...</option>';
  try{
    const r=await fetch(`https://data.etagmb.gov.hk/route/${region}/${route}`);
    const j=await r.json();
    console.log('GMB route detail raw:', j);
    const routeData=Array.isArray(j.data)? j.data[0] : j.data;
    gmbState.routeData=routeData;
    const dirs=routeData.directions || [];
    dirSel.innerHTML=dirs.map((d,i)=>
      `<option value="${i}">${d.dest_tc||d.orig_tc||('方向 '+(i+1))}</option>`
    ).join('');
  }catch(e){ dirSel.innerHTML='<option>載入失敗</option>'; console.error(e); }
}
async function loadGMBStops(){
  const box=document.getElementById('gmbStopResult');
  const dirIdx=document.getElementById('gmbDir').value;
  try{
    const routeData=gmbState.routeData;
    const dirObj=(routeData.directions||[])[dirIdx];
    const routeId=dirObj.route_id || routeData.route_id;
    const direction=dirObj.direction || (Number(dirIdx)+1);
    const serviceType=dirObj.service_type || 1;
    const r=await fetch(`https://data.etagmb.gov.hk/route-stop/${routeId}/${direction}/${serviceType}`);
    const j=await r.json();
    console.log('GMB stops raw:', j);
    const stops=(j.data && j.data.route_stops) || j.data || [];
    gmbState.stops=stops; gmbState.routeId=routeId; gmbState.serviceType=serviceType;
    box.innerHTML=stops.map(s=>
      `<div class="stop-result" onclick="selectGMBStop(${s.stop_seq})">${s.stop_seq}. ${s.stop_name_tc||s.name_tc||('站 '+s.stop_seq)}</div>`
    ).join('');
  }catch(e){ box.innerHTML=`<p class="muted">❌ ${e.message} (請打開 Console 查看實際回應再調整 code)</p>`; console.error(e); }
}
let lastGMB=null;
async function selectGMBStop(stopSeq){
  lastGMB=stopSeq;
  const box=document.getElementById('gmbResult');
  box.innerHTML='<p class="muted"><span class="spin"></span> 載入中...</p>';
  try{
    const {routeId, serviceType}=gmbState;
    const r=await fetch(`https://data.etagmb.gov.hk/eta/route-stop/${routeId}/${stopSeq}/${serviceType}`);
    const j=await r.json();
    console.log('GMB eta raw:', j);
    const etas=(j.data && j.data.eta) || j.data || [];
    const list=Array.isArray(etas)? etas : [];
    if(!list.length){ box.innerHTML='<p class="muted">暫時未有班次資料</p>'; return; }
    box.innerHTML='<div class="eta-list">'+list.map(x=>{
      const t=x.timestamp || x.eta;
      const mins=t? Math.round((new Date(t)-new Date())/60000) : '-';
      return `<div class="eta-item"><div class="eta-route">小巴</div><div class="eta-min">${mins==='-'?'-':(mins<=0?'即將到達':mins+' 分鐘')}</div></div>`;
    }).join('')+'</div>';
    document.getElementById('gmbUpdated').textContent='更新於 '+new Date().toLocaleTimeString();
  }catch(e){ box.innerHTML=`<p class="muted">❌ ${e.message}</p>`; }
}

/* ============ 初始化 + 還原上次選擇 ============ */
window.onload=()=>{
  initMTR();
  const ml=localStorage.getItem('mtrLine');
  if(ml){ document.getElementById('mtrLine').value=ml; populateMTRStations();
    const ms=localStorage.getItem('mtrSta'); if(ms) document.getElementById('mtrSta').value=ms; }
  const k=localStorage.getItem('kmbStopId'); if(k) document.getElementById('kmbStopId').value=k;
  const co=localStorage.getItem('ctbCo'); if(co) document.getElementById('ctbCo').value=co;
  const c=localStorage.getItem('ctbStopId'); if(c) document.getElementById('ctbStopId').value=c;
};
