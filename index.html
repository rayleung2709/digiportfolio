<html lang="zh-HK">

<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js" integrity="sha384-Cs3dgUx6+jDxxuqHvVH8Onpyj2LF1gKZurLDlhqzuJmUqVYMJ0THTWpxK5Z086Zm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js" integrity="sha384-zPzbVRXfR492Sd5D+HydTYCxxgHAfgVO8KERbLlpeH5unsmbAEXrscGUUqLZG9BM" crossorigin="anonymous"></script>
<style>
:root{--g:#0a7d3b;--r:#c0392b;--bg:#f6f7f9;--card:#fff;--mute:#666}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:#222;font-size:14px}
header{padding:16px;background:var(--card);border-bottom:1px solid #e3e3e3}
.hrow{display:flex;align-items:center;gap:10px}
h1{margin:0 0 4px;font-size:18px;flex:1}.sub{color:var(--mute);font-size:12px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.loading{animation:pulse 1.2s ease-in-out infinite}
.seg{display:inline-flex;border:1px solid #222;border-radius:20px;overflow:hidden}
.seg button{padding:8px 16px;min-height:36px;border:0;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:#222;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:12px 16px}
.kpi{background:var(--card);border-radius:10px;padding:10px 12px;border:1px solid #eee}
.kpi .l{font-size:11px;color:var(--mute)}.kpi .v{font-size:17px;font-weight:600;margin-top:2px}
.pos{color:var(--g)}.neg{color:var(--r)}
nav{display:flex;gap:6px;padding:0 16px}
nav button{flex:1;padding:12px;min-height:40px;border:0;border-radius:8px 8px 0 0;background:#e6e8ec;font-size:14px}
nav button.on{background:var(--card);font-weight:600}
section{display:none;background:var(--card);margin:0 16px 16px;padding:12px;border-radius:0 0 10px 10px}
section.on{display:block}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid #eee}
th:first-child,td:first-child,.l{text-align:left}
th{font-size:11px;color:var(--mute);font-weight:500;position:sticky;top:0;background:var(--card)}
th[data-key]{cursor:pointer;user-select:none}
tr.closed td{color:#999}tfoot td{font-weight:600}
tr[data-code]{cursor:pointer}tr[data-code]:hover td{background:#f3f6ff}
canvas{max-height:300px;margin-bottom:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar button{padding:7px 12px;min-height:32px;border:1px solid #ccc;border-radius:6px;background:#fff;font-size:12px}
.bar button.on{background:#222;color:#fff;border-color:#222}
.bar select,.bar input[type=date]{padding:5px 8px;font-size:13px;border-radius:6px;max-width:100%;border:1px solid #ccc}
.hint{font-size:11px;color:var(--mute);margin-left:auto}
.errbar{display:inline-flex;align-items:center;gap:8px;color:var(--r)}
.errbar button{padding:4px 10px;border-radius:6px;border:1px solid var(--r);background:#fff;color:var(--r);cursor:pointer}
.subhead{margin:16px 4px 6px;font-size:12px;font-weight:600;color:var(--mute)}
/* ── 新增交易表單 ── */
.addform{display:none;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:10px 0;padding:10px;border:1px dashed #aaa;border-radius:8px}
.addform.on{display:flex}
.addform label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute)}
.addform input,.addform select{padding:6px 8px;font-size:13px;border-radius:6px;border:1px solid #ccc;min-width:110px}
.addform button{padding:7px 14px;min-height:34px;border-radius:6px;border:1px solid #222;background:#222;color:#fff;font-size:13px;cursor:pointer}
.addform button#fCancel{background:#fff;color:#222}
.newwrap{display:none;gap:8px;flex-wrap:wrap}
.newwrap.on{display:flex}
#fErr{color:var(--r);flex-basis:100%}
tr.pending td{background:#fff6dc}
.rowdel{border:0;background:none;color:var(--r);font-weight:700;cursor:pointer;font-size:16px;padding:0 6px;line-height:1}
@media (prefers-color-scheme:dark){
  :root{--bg:#111315;--card:#1b1d20;--mute:#9aa0a6}
  body{color:#e8e8e8}
  header{border-color:#2a2d30}
  th,td{border-color:#2a2d30}
  .kpi{border-color:#2a2d30}
  .seg{border-color:#8a8f94}
  nav button{background:#24262a}
  tr[data-code]:hover td{background:#22262e}
  .bar button{background:#1b1d20;border-color:#3a3d42;color:#e8e8e8}
  .bar select,.bar input[type=date]{background:#1b1d20;color:#e8e8e8;border:1px solid #3a3d42}
  tr.pending td{background:#3a3320}
  .addform{border-color:#555}
  .addform button#fCancel{background:#1b1d20;color:#e8e8e8;border-color:#3a3d42}
  .addform input,.addform select{background:#1b1d20;color:#e8e8e8;border-color:#3a3d42}
}
</style>

<body>
<header>
  <div class="hrow"><h1>DigiPortfolio</h1>
    <div class="seg" id="curSeg" role="group" aria-label="貨幣切換">
      <button data-c="USD" aria-pressed="true">USD</button>
      <button data-c="HKD" aria-pressed="false">HKD</button>
    </div></div>

</header>
<div class="kpis" id="kpis"></div>
<nav role="tablist">
  <button data-t="hold" class="on" role="tab" aria-selected="true">持倉</button>
  <button data-t="tx" role="tab" aria-selected="false">交易</button>

</nav>
<section id="hold" class="on" role="tabpanel" aria-hidden="false">

  <div class="bar" id="txPendingBar" style="display:none">
    <span class="hint" id="pendingHint"></span>

  </div>
  <div class="bar">
    <button id="txAddToggle">+ 新增交易</button>
    <span class="hint">新增紀錄後，只暫存於本裝置，務須下載 JSON 去覆蓋 GitHub 之版本。</span>
  </div>
  <form id="txAddForm" class="addform">
    <label>日期<input type="date" id="fDate" required></label>
    <label>代號<select id="fCode"></select></label>
    <span id="fNewWrap" class="newwrap">
      <label>新代號<input id="fNewCode" placeholder="例如 NASDAQ:AAPL"></label>
      <label>名稱<input id="fNewName" placeholder="公司/基金名稱"></label>
      <label>分類<input id="fNewCat" placeholder="例如 股票·科技"></label>
    </span>

    <label id="fPriceWrap">價格<input type="number" id="fPrice" step="any" min="0"></label>
    <label>金額（USD）<input type="number" id="fAmt" step="any" min="0" required></label>
    <button type="submit">新增</button>

  <div class="bar" id="txBar">

    <input type="date" id="txFrom" title="開始日期">
    <input type="date" id="txTo" title="結束日期">
    <button id="txReset">清除篩選</button>

</section>
<section id="hist" role="tabpanel" aria-hidden="true">
  <div class="bar" id="histBar"><span class="hint">滾輪／兩指縮放，拖曳平移</span></div>
  <canvas id="chart"></canvas><div class="wrap" id="histT"></div>
</section>
<section id="inst" role="tabpanel" aria-hidden="true">
  <div class="bar" id="instBar"><select id="instSel"></select><span class="hint">圖例撳一下可隱藏該線</span></div>
  <canvas id="instChart"></canvas>
  <div class="kpis" id="instKpi" style="padding:0 0 10px"></div>
  <div class="wrap" id="instT"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>(n==null||!isFinite(n))?'–':n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>n==null||!isFinite(n)?'–':(n*100).toFixed(1)+'%';
const cls=n=>n>0?'pos':n<0?'neg':'';
const get=u=>fetch(u+'?t='+Date.now()).then(r=>{
  if(!r.ok)throw new Error(`無法載入 ${u}（HTTP ${r.status}）`);
  return r.json();
});
const charts={};
const DAY_MS=86400000, XIRR_MIN_AGE_DAYS=25, YEAR_MS=31557600000; // 365.25 天
const TYPE_LABEL={Buy:'買入',Sell:'賣出',In:'存入',Out:'提取',Dividend:'股息',Fee:'費用'};

function showError(msg){
  const box=$('#upd');
  box.classList.remove('loading');
  box.innerHTML=`<span class="errbar">⚠️ ${esc(msg)} <button id="retryBtn">重試</button></span>`;
  const b=$('#retryBtn');if(b)b.onclick=()=>location.reload();
}

// ── 本機暫存交易（新增交易但未上傳 GitHub，儲喺 localStorage）──
const LS_TX='dp_pendingTx', LS_INST='dp_pendingInst';
const loadPendingTx=()=>{try{return JSON.parse(localStorage.getItem(LS_TX)||'[]');}catch{return[];}};
const savePendingTx=a=>localStorage.setItem(LS_TX,JSON.stringify(a));
const loadPendingInst=()=>{try{return JSON.parse(localStorage.getItem(LS_INST)||'{}');}catch{return{};}};
const savePendingInst=o=>localStorage.setItem(LS_INST,JSON.stringify(o));
function downloadJSON(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
}

// ── 貨幣 ──
let CUR=localStorage.getItem('cur')||'USD';
let FX=7.8;                                   // 最新 USD→HKD（由 prices.json 讀）
let FXH=[];                                   // [[date,rate],...] 歷史匯率，按日期升序
function fxAt(d){                             // 二分搜尋：攞 <=d 嘅最後一個匯率，冇就用 FX
  let ans=FX,lo=0,hi=FXH.length-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(FXH[mid][0]<=d){ans=FXH[mid][1];lo=mid+1;}
    else hi=mid-1;
  }
  return ans;
}
const R=d=>CUR==='HKD'?(d?fxAt(d):FX):1;      // 某日（或今日）換算率
const M=(n,d=2,r=R())=>n==null?'–':fmt(n*r,d); // 金額格式（會換算，內置 isFinite 檢查）

function showTab(id){
  document.querySelectorAll('nav button').forEach(b=>{
    const on=b.dataset.t===id;
    b.classList.toggle('on',on);
    b.setAttribute('aria-selected',on);
  });
  document.querySelectorAll('section').forEach(s=>{
    const on=s.id===id;
    s.classList.toggle('on',on);
    s.setAttribute('aria-hidden',on?'false':'true');
  });
  setTimeout(()=>Object.values(charts).forEach(c=>c?.resize()),0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));

// ── Chart 共用設定 ──
const ZOOM={zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'},pan:{enabled:true,mode:'x'},limits:{x:{minRange:5}}};
const base=()=>({animation:false,interaction:{mode:'index',intersect:false},
  plugins:{zoom:JSON.parse(JSON.stringify(ZOOM)),legend:{position:'bottom'}},
  scales:{x:{ticks:{maxTicksLimit:8}},y:{ticks:{callback:v=>(v/1000).toFixed(0)+'k'}}}});
const RANGES={'1M':30,'3M':91,'6M':182,'YTD':0,'ALL':null};
function sliceR(rows,r){
  if(!rows.length||r==='ALL')return rows;
  const end=new Date(rows[rows.length-1].d);
  const from=r==='YTD'?end.getFullYear()+'-01-01':new Date(end-RANGES[r]*DAY_MS).toISOString().slice(0,10);
  return rows.filter(x=>x.d>=from);
}
function mkBar(el,active,onRange,onReset){
  el.querySelectorAll('button').forEach(b=>b.remove());
  const btns=[];
  if(onRange)for(const k of Object.keys(RANGES)){
    const b=document.createElement('button');
    b.textContent=k;
    const on=k===active;
    if(on)b.className='on';
    b.setAttribute('aria-pressed',on);
    b.onclick=()=>{
      btns.forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false');});
      b.classList.add('on');b.setAttribute('aria-pressed','true');
      onRange(k);
    };
    btns.push(b);
  }
  const r=document.createElement('button');
  r.textContent='↺';r.title='重設縮放';r.setAttribute('aria-label','重設縮放');
  r.onclick=onReset;btns.push(r);
  el.prepend(...btns);
}

// ── 記帳核心（單一交易套用邏輯，供全量／逐日 snapshot 共用，避免 O(days×tx)）──
function newState(){return {pos:{},cash:0,contributed:0,realised:0,div:0,fee:0};}
function applyTx(state,tx){
  const [ ,code,type,units, ,amt]=tx;
  if(code==='XXX:CASH'){
    if(type==='In'){state.cash+=amt;state.contributed+=amt;}
    else if(type==='Out'){state.cash-=amt;state.contributed-=amt;}
    else if(type==='Dividend'){state.cash+=amt;state.div+=amt;}
    else if(type==='Fee'){state.cash-=amt;state.fee+=amt;}
    return;
  }
  const p=state.pos[code]||(state.pos[code]={units:0,cost:0,realised:0});
  if(type==='Buy'){p.units+=units;p.cost+=amt;state.cash-=amt;}
  else if(type==='Sell'){
    const cb=p.cost/p.units*units;
    p.realised+=amt-cb;state.realised+=amt-cb;
    p.units-=units;p.cost-=cb;state.cash+=amt;
    if(p.units<1e-6){p.units=0;p.cost=0;}
  }
}
function replay(txs,asOf){ // 全量 replay（一次性用途）
  const state=newState();
  for(const t of txs){
    if(asOf&&t[0]>asOf)break;
    applyTx(state,t);
  }
  return state;
}
// 逐日 snapshot：一次過順序掃描交易（O(days+tx)），唔再每日重新 replay 全部交易
function buildTimeline(txs,hist){
  const dates=Object.keys(hist).sort();
  const firstTxDate=txs[0]?.[0];
  const state=newState();
  const flowsSoFar=[];
  let last={},ti=0;
  const snaps=[];
  for(const d of dates){
    last={...last,...hist[d]};
    while(ti<txs.length&&txs[ti][0]<=d){
      const t=txs[ti];
      applyTx(state,t);
      if(t[1]==='XXX:CASH'&&(t[2]==='In'||t[2]==='Out')){
        flowsSoFar.push({d:t[0],v:t[2]==='In'?-t[5]:t[5]});
      }
      ti++;
    }
    if(!firstTxDate||d<firstTxDate||Object.keys(hist[d]).every(k=>k.startsWith('FX:')))continue;
    snaps.push({d,S:structuredClone(state),px:{...last},flows:flowsSoFar.slice()});
  }
  return snaps;
}

// ── XIRR（Newton-Raphson，未收斂就返 null，唔會扔假值）──
function xirr(flows){
  if(flows.length<2)return null;
  const t0=new Date(flows[0].d),yr=f=>(new Date(f.d)-t0)/YEAR_MS;
  let r=0.1;
  for(let i=0;i<200;i++){
    let f=0,df=0;
    for(const c of flows){const t=yr(c),b=Math.pow(1+r,t);f+=c.v/b;df-=t*c.v/(b*(1+r));}
    if(Math.abs(df)<1e-12)return null;
    const nr=r-f/df;
    if(!isFinite(nr)||nr<-0.99)return null;
    if(Math.abs(nr-r)<1e-8)return nr;
    r=nr;
  }
  return null; // 200 次都未收斂，放棄，唔好扔個未收斂嘅假值出去
}
const valueAt=(S,prices)=>Object.entries(S.pos).reduce((v,[c,p])=>v+(p.units>0?p.units*(prices[c]??0):0),S.cash);
const extFlows=(txs,upTo)=>txs.filter(t=>(!upTo||t[0]<=upTo)&&t[1]==='XXX:CASH'&&(t[2]==='In'||t[2]==='Out'))
  .map(t=>({d:t[0],v:t[2]==='In'?-t[5]:t[5]}));
const instFlows=(txs,code)=>txs.filter(t=>t[1]===code).map(t=>({d:t[0],v:t[2]==='Buy'?-t[5]:t[5]}));

async function main(){
  let tx,px,hist;
  try{
    [tx,px,hist]=await Promise.all([
      get('data/transactions.json'),
      get('data/prices.json'),
      get('data/history.json'),
    ]);
  }catch(e){
    showError('資料下載失敗：'+e.message);
    console.error(e);
    return;
  }
  if(!tx||!Array.isArray(tx.transactions)){
    showError('transactions.json 內容不完整。');
    return;
  }
  if(!px||typeof px.prices!=='object'){
    showError('prices.json 內容不完整。');
    return;
  }
  if(!hist||typeof hist!=='object'){
    showError('history.json 內容不完整。');
    return;
  }

  // ── 讀返本機暫存（未上傳 GitHub 嘅新增交易／新增代號），merge 埋一齊計數 ──
  let pendingTx=loadPendingTx();
  let pendingInst=loadPendingInst();
  if(!tx.transactions.length&&!pendingTx.length){
    showError('暫時未有任何交易，請按「+ 新增交易」新增第一筆。');
    return;
  }

  const key=t=>t[0]+(t[1]==='XXX:CASH'&&t[2]==='In'?'0':'1');
  const names={...(tx.instruments||{}),...pendingInst};
  const rawTxs=[...tx.transactions,...pendingTx];
  const txs=[...rawTxs].sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:0);
  const prices=px.prices||{};
  const today=px.updated?px.updated.slice(0,10):new Date().toISOString().slice(0,10);
  const short=c=>esc(c.replace('LON:',''));
  const catOf=c=>(names[c]?.category||'未分類').split('·')[0].trim();

  // 匯率
  const fxOk=prices['FX:USDHKD']!=null;
  if(fxOk)FX=prices['FX:USDHKD'];
  FXH=Object.keys(hist).sort().filter(d=>hist[d]['FX:USDHKD']!=null).map(d=>[d,hist[d]['FX:USDHKD']]);

  // 逐日 snapshot（USD，貨幣無關，只計一次）
  const snaps=buildTimeline(txs,hist);
  const firstTxDate=txs[0][0];

  const S=replay(txs),value=valueAt(S,prices),pl=value-S.contributed;
  const irr=xirr([...extFlows(txs),{d:today,v:value}]);
  const H=snaps.map(({d,S:st,px:p,flows})=>{
    const v=valueAt(st,p),old=(new Date(d)-new Date(firstTxDate))>XIRR_MIN_AGE_DAYS*DAY_MS;
    return {d,cost:st.contributed,v,pl:v-st.contributed,irr:old?xirr([...flows,{d,v}]):null};
  });
  const held=Object.keys(names).filter(c=>S.pos[c]);
  const cats=[...new Set(held.map(catOf))];
  let tc=0,tv=0;for(const c of held){const p=S.pos[c];tc+=p.cost;if(p.units>0)tv+=p.units*(prices[c]??0);}

  // UI 狀態（切換貨幣後保留）
  let histRange='ALL',instCode='',holdSort={key:'c',dir:1};
  const sel=$('#instSel');
  sel.innerHTML=`<option value="">全部 · 價格重設為 100（${esc(snaps[0]?.d||'')}）</option>`+
    (cats.length?`<optgroup label="分類彙總">${cats.map(k=>`<option value="CAT:${esc(k)}">${esc(k)}（分類彙總）</option>`).join('')}</optgroup>`:'')+
    `<optgroup label="個股">${held.map(c=>`<option value="${esc(c)}">${short(c)} · ${esc(names[c]?.name||'')}</option>`).join('')}</optgroup>`;
  sel.onchange=()=>{instCode=sel.value;drawInst();};
  $('#curSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{CUR=b.dataset.c;localStorage.setItem('cur',CUR);render();});

  // ── 新增交易表單 ──
  const addForm=$('#txAddForm'),addToggle=$('#txAddToggle');
  const fCode=$('#fCode'),fType=$('#fType'),fUnits=$('#fUnits'),fPrice=$('#fPrice'),fAmt=$('#fAmt');
  const fNewWrap=$('#fNewWrap'),fNewCode=$('#fNewCode'),fNewName=$('#fNewName'),fNewCat=$('#fNewCat');
  const fUnitsWrap=$('#fUnitsWrap'),fPriceWrap=$('#fPriceWrap'),fErr=$('#fErr');
  const CASH_TYPES=['In','Out','Dividend','Fee'],INST_TYPES=['Buy','Sell'];

  function fillCodeSelect(){
    const codes=Object.keys(names).sort();
    fCode.innerHTML=`<option value="XXX:CASH">現金（XXX:CASH）</option>`+
      codes.map(c=>`<option value="${esc(c)}">${short(c)} · ${esc(names[c]?.name||'')}</option>`).join('')+
      `<option value="__NEW__">➕ 新增代號…</option>`;
  }
  function fillTypeSelect(){
    const isCash=fCode.value==='XXX:CASH';
    const opts=isCash?CASH_TYPES:INST_TYPES;
    fType.innerHTML=opts.map(t=>`<option value="${t}">${TYPE_LABEL[t]}</option>`).join('');
    fUnitsWrap.style.display=isCash?'none':'';
    fPriceWrap.style.display=isCash?'none':'';
    fUnits.required=!isCash;fPrice.required=!isCash;
  }
  fCode.onchange=()=>{
    fNewWrap.classList.toggle('on',fCode.value==='__NEW__');
    fillTypeSelect();
  };
  let amtTouched=false;
  fAmt.oninput=()=>amtTouched=true;
  function recalcAmt(){
    if(amtTouched)return;
    const u=parseFloat(fUnits.value),p=parseFloat(fPrice.value);
    if(isFinite(u)&&isFinite(p))fAmt.value=(u*p).toFixed(2);
  }
  fUnits.oninput=recalcAmt;fPrice.oninput=recalcAmt;

  addToggle.onclick=()=>{
    const opening=!addForm.classList.contains('on');
    addForm.classList.toggle('on');
    if(opening){
      fillCodeSelect();fCode.value='XXX:CASH';
      fNewWrap.classList.remove('on');
      fillTypeSelect();
      $('#fDate').value=today;
      fUnits.value=fPrice.value=fAmt.value='';
      fNewCode.value=fNewName.value=fNewCat.value='';
      amtTouched=false;fErr.textContent='';
    }
  };
  $('#fCancel').onclick=()=>{addForm.classList.remove('on');fErr.textContent='';};

  addForm.onsubmit=e=>{
    e.preventDefault();
    fErr.textContent='';
    const d=$('#fDate').value;
    if(!d){fErr.textContent='請選日期';return;}
    let code=fCode.value;
    const type=fType.value;
    const amt=parseFloat(fAmt.value);
    if(!isFinite(amt)||amt<=0){fErr.textContent='請輸入有效金額';return;}
    let units=0,price=0;
    if(code==='__NEW__'){
      code=fNewCode.value.trim();
      const nm=fNewName.value.trim(),cat=fNewCat.value.trim()||'未分類';
      if(!code){fErr.textContent='請輸入新代號';return;}
      if(names[code]){fErr.textContent='代號已存在，請直接喺清單揀';return;}
      pendingInst={...pendingInst,[code]:{name:nm,category:cat}};
      savePendingInst(pendingInst);
      names[code]={name:nm,category:cat};
    }
    if(code!=='XXX:CASH'){
      units=parseFloat(fUnits.value);price=parseFloat(fPrice.value);
      if(!isFinite(units)||units<=0||!isFinite(price)||price<=0){fErr.textContent='請輸入單位同價格';return;}
    }
    const pid='p'+Date.now()+Math.random().toString(36).slice(2,7);
    pendingTx=[...pendingTx,[d,code,type,units,price,amt,pid]];
    savePendingTx(pendingTx);
    location.reload();
  };

  // ── 本機暫存 bar（下載完整 JSON / 清空）──
  function refreshPendingBar(){
    const bar=$('#txPendingBar');
    if(pendingTx.length){
      bar.style.display='';
      $('#pendingHint').textContent=`本機暫存 ${pendingTx.length} 筆未上傳 —— 下載後覆蓋 GitHub 嗰份 transactions.json，再撳「清空本機暫存」`;
    }else{
      bar.style.display='none';
    }
    const txNavBtn=document.querySelector('nav button[data-t="tx"]');
    if(txNavBtn)txNavBtn.textContent='交易'+(pendingTx.length?` (${pendingTx.length})`:'');
  }
  $('#txExportBtn').onclick=()=>{
    const merged={...tx,instruments:names,transactions:txs.map(t=>t.slice(0,6))};
    downloadJSON(merged,'transactions.json');
  };
  $('#txClearPendingBtn').onclick=()=>{
    if(!confirm('確定要清空本機暫存嘅新增交易？（請先確認已經上傳咗去 GitHub，唔然啲交易會冇咗）'))return;
    localStorage.removeItem(LS_TX);localStorage.removeItem(LS_INST);
    location.reload();
  };
  refreshPendingBar();

  // ── 交易篩選（代號 / 類型 / 日期範圍）──
  const txCodeSel=$('#txCode'),txTypeSel=$('#txType'),txFromInp=$('#txFrom'),txToInp=$('#txTo'),txResetBtn=$('#txReset');
  const allCodes=[...new Set(txs.map(t=>t[1]))].sort();
  txCodeSel.innerHTML=`<option value="">全部代號</option>`+
    allCodes.map(c=>`<option value="${esc(c)}">${c==='XXX:CASH'?'現金':short(c)}</option>`).join('');
  const allTypes=[...new Set(txs.map(t=>t[2]))];
  txTypeSel.innerHTML=`<option value="">全部類型</option>`+
    allTypes.map(t=>`<option value="${esc(t)}">${esc(TYPE_LABEL[t]||t)}</option>`).join('');
  txFromInp.min=txToInp.min=txs[0][0];
  txFromInp.max=txToInp.max=txs[txs.length-1][0];
  [txCodeSel,txTypeSel,txFromInp,txToInp].forEach(el=>el.onchange=drawTx);
  txResetBtn.onclick=()=>{
    txCodeSel.value='';txTypeSel.value='';txFromInp.value='';txToInp.value='';
    drawTx();
  };

  function filteredTxs(){
    const code=txCodeSel.value,type=txTypeSel.value,from=txFromInp.value,to=txToInp.value;
    return txs.filter(t=>{
      if(code&&t[1]!==code)return false;
      if(type&&t[2]!==type)return false;
      if(from&&t[0]<from)return false;
      if(to&&t[0]>to)return false;
      return true;
    });
  }
  function drawTx(){
    const list=filteredTxs();
    $('#txCount').textContent=`共 ${list.length} / ${txs.length} 筆`;
    $('#txT').innerHTML=list.length?`<table><thead><tr><th>日期</th><th class="l">代號</th><th class="l">類型</th><th>單位</th><th>價格</th><th>金額 ${CUR}</th><th></th></tr></thead><tbody>${
      [...list].reverse().map(row=>{
        const [d,c,t,u,p,a,pid]=row;const r=R(d);
        return `<tr class="${pid?'pending':''}"><td>${esc(d)}</td><td class="l">${c==='XXX:CASH'?'現金':short(c)}</td><td class="l">${esc(TYPE_LABEL[t]||t)}</td><td>${u?fmt(u,0):''}</td><td>${p?M(p,2,r):''}</td><td>${M(a,2,r)}</td><td>${pid?`<button class="rowdel" data-pid="${pid}" title="刪除呢筆暫存交易">×</button>`:''}</td></tr>`;
      }).join('')
    }</tbody></table>`:'<div class="sub">無符合條件的交易</div>';
    $('#txT').querySelectorAll('.rowdel').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const pid=b.dataset.pid;
      pendingTx=pendingTx.filter(x=>x[6]!==pid);
      savePendingTx(pendingTx);
      location.reload();
    });
  }

  // ── 持倉排序 ──
  const HOLD_COLS=[
    ['c','代號','l'],['name','名稱','l'],['category','分類','l'],
    ['units','股數'],['cost','成本'],['avg','平均價'],['px','現價'],
    ['mv','市值'],['weight','佔倉'],['u','未實現'],['upct','%'],['realised','已實現']
  ];
  function computeHoldRows(){
    return Object.keys(S.pos).map(c=>{
      const p=S.pos[c],open=p.units>0,pr=prices[c],mv=open?p.units*(pr??0):0,u=mv-p.cost;
      return {
        c,name:names[c]?.name||'',category:names[c]?.category||'未分類',open,
        units:open?p.units:null,cost:open?p.cost:null,avg:open?p.cost/p.units:null,
        px:pr,mv:open?mv:null,weight:open?mv/value:null,u:open?u:null,
        upct:open&&p.cost?u/p.cost:null,realised:p.realised||null
      };
    });
  }
  function sortRows(rows,key,dir){
    return [...rows].sort((a,b)=>{
      if(a.open!==b.open)return (b.open?1:0)-(a.open?1:0);
      if(key==='c'||key==='name'||key==='category'){
        return dir*String(a[key]||'').localeCompare(String(b[key]||''));
      }
      const av=a[key]??-Infinity,bv=b[key]??-Infinity;
      return dir*(av-bv);
    });
  }
  function toggleSort(key){
    if(holdSort.key===key)holdSort.dir*=-1;
    else{holdSort.key=key;holdSort.dir=(key==='c'||key==='name'||key==='category')?1:-1;}
    drawHold();
  }
  function drawHold(){
    const rows=sortRows(computeHoldRows(),holdSort.key,holdSort.dir);
    const thead=`<tr>${HOLD_COLS.map(([k,label,align])=>{
      const arrow=holdSort.key===k?(holdSort.dir>0?' ▲':' ▼'):'';
      return `<th class="${align||''}" data-key="${k}">${label}${arrow}</th>`;
    }).join('')}</tr>`;
    const body=rows.map(r=>`<tr data-code="${esc(r.c)}" class="${r.open?'':'closed'}">
      <td>${short(r.c)}</td><td class="l">${esc(r.name)}</td><td class="l">${esc(r.category)}</td>
      <td>${r.open?fmt(r.units,0):'–'}</td><td>${r.open?M(r.cost,0):'–'}</td><td>${r.open?M(r.avg):'–'}</td>
      <td>${M(r.px)}</td><td>${r.open?M(r.mv,0):'–'}</td>
      <td>${r.open?pct(r.weight):'–'}</td>
      <td class="${cls(r.u)}">${r.open?M(r.u,0):'–'}</td><td class="${cls(r.u)}">${r.open?pct(r.upct):'–'}</td>
      <td class="${cls(r.realised)}">${r.realised?M(r.realised,0):'–'}</td></tr>`).join('');
    $('#holdT').innerHTML=`<table><thead>${thead}</thead><tbody>${body}</tbody>
      <tfoot><tr><td colspan="4">合計（不含現金）${CUR}</td><td>${M(tc,0)}</td><td></td><td></td><td>${M(tv,0)}</td>
      <td>${pct(tv/value)}</td>
      <td class="${cls(tv-tc)}">${M(tv-tc,0)}</td><td class="${cls(tv-tc)}">${pct((tv-tc)/tc)}</td><td class="${cls(S.realised)}">${M(S.realised,0)}</td></tr></tfoot></table>`;
    $('#holdT').querySelectorAll('th[data-key]').forEach(th=>th.onclick=()=>toggleSort(th.dataset.key));
    $('#holdT').querySelectorAll('tr[data-code]').forEach(r=>r.onclick=()=>{instCode=sel.value=r.dataset.code;drawInst();showTab('inst');});
    drawHoldAgg(rows);
  }
  function drawHoldAgg(rows){
    const groups={};
    for(const r of rows){
      const k=(r.category||'未分類').split('·')[0].trim();
      const g=groups[k]||(groups[k]={cost:0,mv:0,realised:0});
      if(r.open){g.cost+=r.cost;g.mv+=r.mv;}
      g.realised+=r.realised||0;
    }
    const order=['股票','債券'];
    const keys=Object.keys(groups).sort((a,b)=>{
      const ia=order.indexOf(a),ib=order.indexOf(b);
      if(ia===-1&&ib===-1)return a.localeCompare(b);
      if(ia===-1)return 1;if(ib===-1)return -1;return ia-ib;
    });
    const body=keys.map(k=>{
      const g=groups[k],u=g.mv-g.cost;
      return `<tr><td class="l">${esc(k)}</td><td>${M(g.cost,0)}</td><td>${M(g.mv,0)}</td>
        <td>${g.mv?pct(g.mv/value):'–'}</td>
        <td class="${cls(u)}">${M(u,0)}</td><td class="${cls(u)}">${g.cost?pct(u/g.cost):'–'}</td>
        <td class="${cls(g.realised)}">${g.realised?M(g.realised,0):'–'}</td></tr>`;
    }).join('');
    $('#holdAggT').innerHTML=`<table><thead><tr><th class="l">分類</th><th>成本</th><th>市值</th><th>佔倉</th><th>未實現</th><th>%</th><th>已實現</th></tr></thead><tbody>${body}</tbody></table>`;
  }

  function render(){
    $('#curSeg').querySelectorAll('button').forEach(b=>{
      const on=b.dataset.c===CUR;
      b.classList.toggle('on',on);
      b.setAttribute('aria-pressed',on);
    });
    Object.keys(charts).forEach(k=>{charts[k]?.destroy();delete charts[k];});
    const upd=$('#upd');
    upd.classList.remove('loading');
    upd.textContent='價格更新：'+(px.updated?new Date(px.updated).toLocaleString('zh-HK'):'（未有，去 Actions 跑一次）')
      +(CUR==='HKD'?` · USD/HKD ${fmt(FX,4)}`+(fxOk?'':'（未抓到匯率，暫用 7.80）'):'');

    // ── 頂部 KPI ──
    $('#kpis').innerHTML=[
      [`總成本（淨入金）${CUR}`,M(S.contributed,0)],
      [`總市值 ${CUR}`,M(value,0)],
      ['總盈虧',`<span class="${cls(pl)}">${M(pl,0)} (${pct(pl/S.contributed)})</span>`],
      ['年化 XIRR',`<span class="${cls(irr)}">${pct(irr)}</span>`],
      ['已實現盈虧',`<span class="${cls(S.realised)}">${M(S.realised,0)}</span>`],
      ['股息 / 費用',`${M(S.div,0)} / ${M(S.fee,0)}`],
      ['現金',M(S.cash,0)],
    ].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');

    // ── Tab 1 持倉 ──
    drawHold();

    // ── Tab 2 交易（篩選 + 用交易當日匯率）──
    drawTx();

    // ── Tab 3 歷史（表同圖共用 range）──
    function drawHistTable(D){
      $('#histT').innerHTML=`<table><thead><tr><th>日期</th><th>總成本</th><th>總市值</th><th>盈虧</th><th>%</th><th>XIRR</th></tr></thead><tbody>${
        [...D].reverse().map(h=>{const r=R(h.d);return `<tr><td>${esc(h.d)}</td><td>${M(h.cost,0,r)}</td><td>${M(h.v,0,r)}</td><td class="${cls(h.pl)}">${M(h.pl,0,r)}</td><td class="${cls(h.pl)}">${pct(h.pl/h.cost)}</td><td class="${cls(h.irr)}">${pct(h.irr)}</td></tr>`;}).join('')
      }</tbody></table>`;
    }
    const drawHist=rg=>{
      histRange=rg;charts.hist?.destroy();const D=sliceR(H,rg);
      drawHistTable(D);
      const o=base();
      o.scales.y1={position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>(v/1000).toFixed(0)+'k'},
        title:{display:true,text:`盈虧 ${CUR}`,font:{size:10}}};
      charts.hist=new Chart($('#chart'),{type:'line',data:{labels:D.map(h=>h.d),datasets:[
        {label:`總市值 ${CUR}`,data:D.map(h=>h.v*R(h.d)),borderColor:'#0a7d3b',pointRadius:0,tension:.2,yAxisID:'y'},
        {label:`總成本 ${CUR}`,data:D.map(h=>h.cost*R(h.d)),borderColor:'#999',borderDash:[4,4],pointRadius:0,stepped:true,yAxisID:'y'},
        {label:`盈虧 ${CUR}`,data:D.map(h=>h.pl*R(h.d)),pointRadius:0,tension:.2,borderWidth:1.5,yAxisID:'y1',
          segment:{borderColor:c=>c.p1.parsed.y>=0?'#0a7d3b':'#c0392b'},borderColor:'#0a7d3b',
          fill:{target:'origin',above:'rgba(10,125,59,.10)',below:'rgba(192,57,43,.10)'}}]},options:o});
    };
    mkBar($('#histBar'),histRange,drawHist,()=>charts.hist?.resetZoom());
    if(H.length)drawHist(histRange);

    // ── Tab 4 個股 ──
    mkBar($('#instBar'),null,null,()=>charts.inst?.resetZoom());
    if(snaps.length)drawInst();
  }

  function drawInst(){
    const code=instCode;
    charts.inst?.destroy();

    // ── 分類彙總（股票／債券）──
    if(code.startsWith('CAT:')){
      const catName=code.slice(4);
      const codesInCat=held.filter(c=>catOf(c)===catName);
      const rows=[];
      for(const {d,S:st,px:p} of snaps){
        let mv=0,cost=0,realised=0,seen=false;
        for(const c of codesInCat){
          const q=st.pos[c];if(!q)continue;seen=true;
          realised+=q.realised||0;cost+=q.cost;
          if(q.units>0&&p[c]!=null)mv+=q.units*p[c];
        }
        if(!seen)continue;
        rows.push({d,r:R(d),cost,mv,u:mv-cost,realised});
      }
      const o=base();
      o.scales.y1={position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>(v/1000).toFixed(0)+'k'},title:{display:true,text:`盈虧 ${CUR}`,font:{size:10}}};
      charts.inst=new Chart($('#instChart'),{type:'line',data:{labels:rows.map(x=>x.d),datasets:[
        {label:`市值 ${CUR}`,data:rows.map(x=>x.mv*x.r),borderColor:'#0a7d3b',pointRadius:0,tension:.2,yAxisID:'y'},
        {label:`成本 ${CUR}`,data:rows.map(x=>x.cost*x.r),borderColor:'#999',borderDash:[4,4],pointRadius:0,stepped:true,yAxisID:'y'},
        {label:`未實現盈虧 ${CUR}`,data:rows.map(x=>x.u*x.r),pointRadius:0,tension:.2,borderWidth:1.5,yAxisID:'y1',
          segment:{borderColor:c=>c.p1.parsed.y>=0?'#0a7d3b':'#c0392b'},borderColor:'#0a7d3b',
          fill:{target:'origin',above:'rgba(10,125,59,.10)',below:'rgba(192,57,43,.10)'}}]},options:o});
      const mvNow=codesInCat.reduce((s,c)=>{const p=S.pos[c];return s+(p&&p.units>0?p.units*(prices[c]??0):0);},0);
      const costNow=codesInCat.reduce((s,c)=>s+(S.pos[c]?.cost||0),0);
      const realisedNow=codesInCat.reduce((s,c)=>s+(S.pos[c]?.realised||0),0);
      const combinedFlows=codesInCat.flatMap(c=>instFlows(txs,c)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
      const iirr=xirr([...combinedFlows,{d:today,v:mvNow}]);
      $('#instKpi').innerHTML=[
        [`市值 ${CUR}`,M(mvNow,0)],
        [`成本 ${CUR}`,M(costNow,0)],
        ['未實現',`<span class="${cls(mvNow-costNow)}">${M(mvNow-costNow,0)}${costNow?' ('+pct((mvNow-costNow)/costNow)+')':''}</span>`],
        ['已實現',`<span class="${cls(realisedNow)}">${M(realisedNow,0)}</span>`],
        ['分類 XIRR',`<span class="${cls(iirr)}">${pct(iirr)}</span>`],
        ['佔倉',pct(mvNow/value)],
      ].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
      $('#instT').innerHTML=`<table><thead><tr><th>日期</th><th>成本</th><th>市值</th><th>未實現</th><th>%</th><th>已實現</th></tr></thead><tbody>${
        [...rows].reverse().map(x=>`<tr><td>${esc(x.d)}</td><td>${M(x.cost,0,x.r)}</td><td>${M(x.mv,0,x.r)}</td>
          <td class="${cls(x.u)}">${M(x.u,0,x.r)}</td><td class="${cls(x.u)}">${x.cost?pct(x.u/x.cost):'–'}</td>
          <td class="${cls(x.realised)}">${x.realised?M(x.realised,0,x.r):'–'}</td></tr>`).join('')
      }</tbody></table>`;
      return;
    }

    if(!code){
      const ds=held.map((c,i)=>{let b=null;return {label:short(c),borderColor:`hsl(${Math.round(i*360/held.length)} 60% 45%)`,
        pointRadius:0,tension:.2,spanGaps:true,borderWidth:1.5,
        data:snaps.map(s=>{const p=s.px[c];if(p==null)return null;b??=p;return p/b*100;})};});
      const o=base();o.scales.y.ticks.callback=v=>v.toFixed(0);
      charts.inst=new Chart($('#instChart'),{type:'line',data:{labels:snaps.map(s=>s.d),datasets:ds},options:o});
      $('#instKpi').innerHTML='';
      const Rw=held.map(c=>{
        const first=snaps.find(s=>s.px[c]!=null)?.px[c],p=S.pos[c],open=p.units>0,mv=open?p.units*(prices[c]??0):0,u=mv-p.cost;
        return {c,open,chg:first?prices[c]/first-1:null,u,r:p.realised,tot:u+p.realised,irr:xirr([...instFlows(txs,c),{d:today,v:mv}]),w:mv/value};
      }).sort((a,b)=>b.tot-a.tot);
      $('#instT').innerHTML=`<table><thead><tr><th>代號</th><th class="l">名稱</th><th>價格變動</th><th>未實現</th><th>已實現</th><th>合計貢獻 ${CUR}</th><th>個股 XIRR</th><th>佔倉</th></tr></thead><tbody>${
        Rw.map(x=>`<tr data-code="${esc(x.c)}" class="${x.open?'':'closed'}"><td>${short(x.c)}</td><td class="l">${esc(names[x.c]?.name||'')}</td>
          <td class="${cls(x.chg)}">${pct(x.chg)}</td><td class="${cls(x.u)}">${x.open?M(x.u,0):'–'}</td><td class="${cls(x.r)}">${x.r?M(x.r,0):'–'}</td>
          <td class="${cls(x.tot)}">${M(x.tot,0)}</td><td class="${cls(x.irr)}">${pct(x.irr)}</td><td>${x.open?pct(x.w):'–'}</td></tr>`).join('')
      }</tbody><tfoot><tr><td colspan="3">合計</td><td class="${cls(tv-tc)}">${M(tv-tc,0)}</td><td class="${cls(S.realised)}">${M(S.realised,0)}</td>
        <td class="${cls(tv-tc+S.realised)}">${M(tv-tc+S.realised,0)}</td><td></td><td>${pct(tv/value)}</td></tr></tfoot></table>`;
      $('#instT').querySelectorAll('tr[data-code]').forEach(r=>r.onclick=()=>{instCode=sel.value=r.dataset.code;drawInst();});
      return;
    }
    // 單隻
    const rows=[];
    for(const {d,S:st,px:p} of snaps){
      const q=st.pos[code],pr=p[code];if(!q||pr==null)continue;
      const mv=q.units*pr;rows.push({d,r:R(d),units:q.units,cost:q.cost,avg:q.units?q.cost/q.units:null,px:pr,mv,u:mv-q.cost,realised:q.realised});
    }
    const o=base();
    o.scales.y1={position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>(v/1000).toFixed(0)+'k'},title:{display:true,text:`盈虧 ${CUR}`,font:{size:10}}};
    o.scales.y2={position:'right',display:false};           // 現價：隱藏軸，只睇形狀
    charts.inst=new Chart($('#instChart'),{type:'line',data:{labels:rows.map(x=>x.d),datasets:[
      {label:`市值 ${CUR}`,data:rows.map(x=>x.mv*x.r),borderColor:'#0a7d3b',pointRadius:0,tension:.2,yAxisID:'y'},
      {label:`成本 ${CUR}`,data:rows.map(x=>x.cost*x.r),borderColor:'#999',borderDash:[4,4],pointRadius:0,stepped:true,yAxisID:'y'},
      {label:`未實現盈虧 ${CUR}`,data:rows.map(x=>x.u*x.r),pointRadius:0,tension:.2,borderWidth:1.5,yAxisID:'y1',
        segment:{borderColor:c=>c.p1.parsed.y>=0?'#0a7d3b':'#c0392b'},borderColor:'#0a7d3b',
        fill:{target:'origin',above:'rgba(10,125,59,.10)',below:'rgba(192,57,43,.10)'}},
      {label:`現價 ${CUR}`,data:rows.map(x=>x.px*x.r),borderColor:'#2c5fd1',pointRadius:0,tension:.2,borderWidth:1,yAxisID:'y2',hidden:true}]},options:o});
    const p=S.pos[code],open=p.units>0,pr=prices[code],mv=open?p.units*(pr??0):0,u=mv-p.cost;
    const firstBuy=txs.find(t=>t[1]===code&&t[2]==='Buy'),iirr=xirr([...instFlows(txs,code),{d:today,v:mv}]);
    const kpiRows=[
      ['股數',open?fmt(p.units,0):'已清倉'],
      [`平均成本 / 現價 ${CUR}`,open?`${M(p.cost/p.units)} / ${M(pr)}`:M(pr)],
      [`市值 ${CUR}`,M(mv,0)],
      ['未實現',`<span class="${cls(u)}">${open?M(u,0)+' ('+pct(u/p.cost)+')':'–'}</span>`],
      ['已實現',`<span class="${cls(p.realised)}">${M(p.realised,0)}</span>`],
      ['個股 XIRR',`<span class="${cls(iirr)}">${pct(iirr)}</span>`],
    ];
    if(firstBuy){ // 冇 Buy 記錄（例如轉倉入 / 送股）時唔顯示呢一行，避免 crash
      kpiRows.push([`價格變動（自首次買入 ${esc(firstBuy[0])}）`,
        `<span class="${cls(pr/firstBuy[4]-1)}">${pct(pr/firstBuy[4]-1)}</span>`]);
    }
    $('#instKpi').innerHTML=kpiRows.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
    $('#instT').innerHTML=`<table><thead><tr><th>日期</th><th>股數</th><th>成本</th><th>平均價</th><th>現價</th><th>市值</th><th>未實現</th><th>%</th><th>已實現</th></tr></thead><tbody>${
      [...rows].reverse().map(x=>`<tr class="${x.units?'':'closed'}"><td>${esc(x.d)}</td><td>${fmt(x.units,0)}</td><td>${M(x.cost,0,x.r)}</td><td>${M(x.avg,2,x.r)}</td><td>${M(x.px,2,x.r)}</td>
        <td>${M(x.mv,0,x.r)}</td><td class="${cls(x.u)}">${x.units?M(x.u,0,x.r):'–'}</td><td class="${cls(x.u)}">${x.units?pct(x.u/x.cost):'–'}</td><td class="${cls(x.realised)}">${x.realised?M(x.realised,0,x.r):'–'}</td></tr>`).join('')
    }</tbody></table>`;
  }

  render();
}
main().catch(e=>{showError('未預期的錯誤：'+e.message);console.error(e);});
</script>
</body>
</html>
