<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的交通ETA</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .card h2 {
    font-size: 16px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    font-weight: bold;
  }
  .tag.mtr { background: #b00042; }
  .tag.gmb { background: #1a7a3c; }
  .tag.ctb { background: #ffab00; color:#222; }
  .sub {
    font-size: 12px;
    color: #777;
    margin-bottom: 8px;
  }
  .dir-block {
    margin-bottom: 8px;
  }
  .dir-title {
    font-size: 12px;
    font-weight: bold;
    color: #555;
    margin-bottom: 2px;
  }
  .eta-line {
    font-size: 14px;
    padding: 3px 0;
    border-bottom: 1px dashed #eee;
    display: flex;
    justify-content: space-between;
  }
  .eta-line:last-child { border-bottom: none; }
  .eta-min {
    font-weight: bold;
    color: #0a58ca;
  }
  .loading { color: #aaa; font-size: 13px; }
  .error { color: #c00; font-size: 13px; }
  .updated {
    font-size: 10px;
    color: #999;
    text-align: right;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>🚉 我的交通 ETA</h1>
<div class="grid" id="grid"></div>

<script>
/* ========== 設定區：你要嘅站同線 ========== */

const MTR_CONFIG = [
  { title: "鑽石山 — 屯馬線", line: "TML", sta: "DIH",
    dirs: [ {key:"UP", label:"往屯門"}, {key:"DOWN", label:"往烏溪沙"} ] },
  { title: "鑽石山 — 觀塘線", line: "KTL", sta: "DIH",
    dirs: [ {key:"UP", label:"往調景嶺"}, {key:"DOWN", label:"往黃埔"} ] },
  { title: "鰂魚涌 — 港島線", line: "ISL", sta: "QUB",
    dirs: [ {key:"UP", label:"往柴灣"}, {key:"DOWN", label:"往堅尼地城"} ] },
  { title: "銅鑼灣 — 港島線", line: "ISL", sta: "CAB",
    dirs: [ {key:"UP", label:"往柴灣"}, {key:"DOWN", label:"往堅尼地城"} ] },
];

const GMB_CONFIG = [
  { title: "港島 GMB 26 — 香港港安醫院站", region: "HKI", route: "26", stopMatch: "港安醫院" },
  { title: "港島 GMB 26 — 利園山道 鳳鳴大廈外", region: "HKI", route: "26", stopMatch: "鳳鳴大廈" },
];

const CTB_CONFIG = [
  { title: "Citybus 6 — 站 001136", route: "6", stop: "001136" },
  { title: "Citybus 6 — 站 002506", route: "6", stop: "002506" },
  { title: "Citybus 15 — 站 001136", route: "15", stop: "001136" },
  { title: "Citybus 15 — 站 002506", route: "15", stop: "002506" },
];

/* ========== 共用function ========== */

function fmtTime(t) {
  if (!t) return "--";
  const d = new Date(t);
  if (isNaN(d)) return t;
  return d.toTimeString().slice(0,5);
}

function minsLeft(t) {
  if (!t) return null;
  const diff = Math.round((new Date(t) - new Date()) / 60000);
  return diff < 0 ? 0 : diff;
}

function makeCard(id, title, tagClass, tagText, sub) {
  const div = document.createElement("div");
  div.className = "card";
  div.id = id;
  div.innerHTML = `
    <h2>${title} <span class="tag ${tagClass}">${tagText}</span></h2>
    <div class="sub">${sub || ""}</div>
    <div class="body loading">載入中...</div>
    <div class="updated"></div>
  `;
  return div;
}

function setBody(cardId, html) {
  const card = document.getElementById(cardId);
  if (!card) return;
  card.querySelector(".body").innerHTML = html;
  card.querySelector(".body").classList.remove("loading");
  card.querySelector(".updated").textContent = "更新於 " + new Date().toTimeString().slice(0,8);
}

function setError(cardId, msg) {
  const card = document.getElementById(cardId);
  if (!card) return;
  card.querySelector(".body").innerHTML = `<div class="error">⚠️ ${msg}</div>`;
}

/* ========== MTR ========== */

async function loadMTR(cfg, cardId) {
  try {
    const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${cfg.line}&sta=${cfg.sta}&lang=TC`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.status === 0) {
      setError(cardId, json.message || "暫時冇資料 / 服務調整");
      return;
    }
    const key = `${cfg.line}-${cfg.sta}`;
    const data = json.data && json.data[key];
    if (!data) {
      setError(cardId, "暫時冇班次資料");
      return;
    }
    let html = "";
    cfg.dirs.forEach(d => {
      const arr = data[d.key] || [];
      html += `<div class="dir-block"><div class="dir-title">${d.label}</div>`;
      if (arr.length === 0) {
        html += `<div class="eta-line">暫無班次</div>`;
      } else {
        arr.slice(0,3).forEach(t => {
          const m = minsLeft(t.time);
          html += `<div class="eta-line"><span>${fmtTime(t.time)} (${t.plat}號月台)</span><span class="eta-min">${m===0?"即將到站":m+" 分鐘"}</span></div>`;
        });
      }
      html += `</div>`;
    });
    setBody(cardId, html);
  } catch (e) {
    setError(cardId, "讀取失敗");
  }
}

/* ========== Citybus ========== */

async function loadCTB(cfg, cardId) {
  try {
    const url = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${cfg.stop}/${cfg.route}`;
    const res = await fetch(url);
    const json = await res.json();
    const arr = json.data || [];
    if (arr.length === 0) {
      setError(cardId, "暫時冇班次資料");
      return;
    }
    let html = "";
    arr.slice(0,4).forEach(t => {
      const m = minsLeft(t.eta);
      const dirLabel = t.dir === "I" ? "回程" : "去程";
      html += `<div class="eta-line"><span>${dirLabel} → ${t.dest||""}</span><span class="eta-min">${m===0?"即將到站":m+" 分鐘"}</span></div>`;
    });
    setBody(cardId, html);
  } catch (e) {
    setError(cardId, "讀取失敗");
  }
}
/* ========== GMB（除錯加強版） ========== */

async function loadGMB(cfg, cardId) {
  const debug = []; // 除錯log,顯示喺卡片底

  function showDebug(html, isError) {
    const card = document.getElementById(cardId);
    if (!card) return;
    card.querySelector(".body").innerHTML = html + 
      `<div style="margin-top:6px;font-size:10px;color:#999;white-space:pre-wrap;">${debug.join("<br>")}</div>`;
    card.querySelector(".body").classList.remove("loading");
  }

  try {
    debug.push(`Step1: fetch route/${cfg.region}/${cfg.route}`);
    const routeUrl = `https://data.etagmb.gov.hk/route/${cfg.region}/${cfg.route}`;
    const routeRes = await fetch(routeUrl);
    debug.push(`→ HTTP ${routeRes.status}`);
    const routeText = await routeRes.text();
    debug.push(`→ raw(前200字): ${routeText.slice(0,200)}`);

    let routeJson;
    try { routeJson = JSON.parse(routeText); }
    catch(e) { showDebug(`<div class="error">⚠️ Step1回應唔係JSON</div>`, true); return; }

    const routeData = routeJson.data;
    if (!routeData) { showDebug(`<div class="error">⚠️ Step1冇data field</div>`, true); return; }

    const routeList = Array.isArray(routeData) ? routeData : [routeData];
    debug.push(`Step1 OK: 搵到 ${routeList.length} 個route項目`);

    let found = null;

    for (const r of routeList) {
      const routeId = r.route_id;
      const directions = r.directions || [];
      debug.push(`檢查route_id=${routeId}, directions數量=${directions.length}`);

      for (const dirInfo of directions) {
        const routeSeq = dirInfo.route_seq;
        const rsUrl = `https://data.etagmb.gov.hk/route-stop/${routeId}/${routeSeq}`;
        const rsRes = await fetch(rsUrl);
        const rsText = await rsRes.text();
        let rsJson;
        try { rsJson = JSON.parse(rsText); } catch(e) {
          debug.push(`route-stop 回應唔係JSON: ${rsText.slice(0,100)}`);
          continue;
        }
        const stops = Array.isArray(rsJson.data) ? rsJson.data : [];
        debug.push(`route_seq=${routeSeq} 有 ${stops.length} 個站`);

        // 平行攞哂全部站名，加快速度
        const stopNames = await Promise.all(stops.map(async s => {
          try {
            const stopRes = await fetch(`https://data.etagmb.gov.hk/stop/${s.stop_id}`);
            const stopJson = await stopRes.json();
            const name = (stopJson.data && (stopJson.data.name_tc || stopJson.data.name_en)) || "";
            return { ...s, name };
          } catch(e) { return { ...s, name: "" }; }
        }));

        // debug: 列出所有站名,等我對比實際字眼
        debug.push(`站名列表: ${stopNames.map(x=>x.name).join("、")}`);

        const match = stopNames.find(x => x.name.includes(cfg.stopMatch));
        if (match) {
          found = { route_id: routeId, route_seq: routeSeq, stop_id: match.stop_id, stop_seq: match.stop_seq, stopName: match.name };
          break;
        }
      }
      if (found) break;
    }

    if (!found) {
      showDebug(`<div class="error">⚠️ 搵唔到站名含「${cfg.stopMatch}」，請睇下面站名列表岀邊個先岩</div>`, true);
      return;
    }

    debug.push(`搵到站: ${found.stopName} (stop_seq=${found.stop_seq})`);

    const etaUrl = `https://data.etagmb.gov.hk/eta/route-stop/${found.route_id}/${found.stop_seq}`;
    const etaRes = await fetch(etaUrl);
    const etaText = await etaRes.text();
    debug.push(`ETA raw(前200字): ${etaText.slice(0,200)}`);

    let etaJson;
    try { etaJson = JSON.parse(etaText); } catch(e) {
      showDebug(`<div class="error">⚠️ ETA回應唔係JSON</div>`, true); return;
    }

    const etaArr = (etaJson.data && etaJson.data[0] && etaJson.data[0].eta) || [];
    let html = `<div class="sub">配對站名：${found.stopName}</div>`;
    if (etaArr.length === 0) {
      html += `<div class="eta-line">暫無班次</div>`;
    } else {
      etaArr.slice(0,3).forEach(t => {
        const m = minsLeft(t.eta);
        html += `<div class="eta-line"><span>${fmtTime(t.eta)}</span><span class="eta-min">${m===0?"即將到站":m+" 分鐘"}</span></div>`;
      });
    }
    showDebug(html, false);

  } catch (e) {
    showDebug(`<div class="error">⚠️ Exception: ${e.message}</div>`, true);
  }
}

/* ========== 初始化畫面 + 定時更新 ========== */

const grid = document.getElementById("grid");
const tasks = [];

MTR_CONFIG.forEach((cfg, i) => {
  const id = `mtr-${i}`;
  grid.appendChild(makeCard(id, cfg.title, "mtr", "MTR", `${cfg.line} / ${cfg.sta}`));
  tasks.push(() => loadMTR(cfg, id));
});

GMB_CONFIG.forEach((cfg, i) => {
  const id = `gmb-${i}`;
  grid.appendChild(makeCard(id, cfg.title, "gmb", "GMB", `${cfg.region} 路線 ${cfg.route}`));
  tasks.push(() => loadGMB(cfg, id));
});

CTB_CONFIG.forEach((cfg, i) => {
  const id = `ctb-${i}`;
  grid.appendChild(makeCard(id, cfg.title, "ctb", "CTB", `路線 ${cfg.route} / 站 ${cfg.stop}`));
  tasks.push(() => loadCTB(cfg, id));
});

function refreshAll() {
  tasks.forEach(fn => fn());
}

refreshAll();
setInterval(refreshAll, 30000); // 每30秒更新
</script>

</body>
</html>
