<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的強積金 (MPF) 投資組合</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#20293c; --text:#e8ecf5; --sub:#8b95ab;
    --green:#2ecc71; --red:#e74c3c; --border:#2b3550;
    --american:#e74c3c; --asia:#3498db; --global:#2ecc71; --growth:#9b59b6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);}
  header{padding:20px 24px 8px;}
  h1{margin:0 0 4px;font-size:22px;}
  .sub{color:var(--sub);font-size:13px;margin-bottom:16px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:0 24px 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .card .label{font-size:12px;color:var(--sub);margin-bottom:6px;}
  .card .value{font-size:20px;font-weight:600;}

  .tabs{display:flex;gap:6px;padding:0 24px;border-bottom:1px solid var(--border);}
  .tab-btn{background:none;border:none;color:var(--sub);padding:10px 16px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--text);border-bottom:2px solid #4d7cff;font-weight:600;}

  .tab-content{display:none;padding:18px 24px 40px;}
  .tab-content.active{display:block;}

  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:10px;overflow:hidden;}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  th{background:var(--card2);color:var(--sub);font-weight:500;position:sticky;top:0;}
  tr:hover td{background:#1f2942;}
  .pos{color:var(--green);}
  .neg{color:var(--red);}
  .pending-row td{background:#2a2314 !important;}

  .fund-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;color:#fff;}
  .tag-American{background:var(--american);}
  .tag-Asia{background:var(--asia);}
  .tag-Global{background:var(--global);}
  .tag-Growth{background:var(--growth);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  .panel h3{margin:0 0 12px;font-size:15px;}

  .form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px;}
  .form-row div{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:4px;}
  input,select{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;}
  button.action{background:#4d7cff;border:none;color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;}
  button.action.secondary{background:#3a4258;}
  button.action.danger{background:#e74c3c;}
  button.small{padding:4px 8px;font-size:11px;border-radius:5px;border:none;background:#3a4258;color:#fff;cursor:pointer;}

  .chart-wrap{position:relative;height:380px;}
  .note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6;}
  .table-wrap{max-height:520px;overflow:auto;}
  select#fundSelect{margin-bottom:14px;}
</style>
</head>
<body>

<header>
  <h1>💰 我的強積金 (MPF) 投資組合</h1>
</header>

<div class="cards" id="summaryCards"></div>

<div class="tabs">
  <button class="tab-btn active" data-tab="positions">持倉</button>
  <button class="tab-btn" data-tab="transactions">供款記錄</button>
  <button class="tab-btn" data-tab="history">走勢圖</button>
  <button class="tab-btn" data-tab="detail">個股</button>
</div>

<!-- 持倉 -->
<div class="tab-content active" id="tab-positions">
  <div class="panel">
    <h3>各基金持倉概覽</h3>
    <div class="table-wrap">
      <table id="positionsTable">
        <thead><tr>
          <th>基金</th><th>累積股數</th><th>平均成本價</th><th>累積成本</th>
          <th>現價</th><th>市值</th><th>帳面損益</th><th>損益%</th><th>佔比</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 供款記錄 -->
<div class="tab-content" id="tab-transactions">
  <div class="panel">
    <h3>➕ 新增供款 / 基金轉換</h3>
    <div class="form-row">
      <div>
        <label>日期</label>
        <input type="date" id="inDate">
      </div>
      <div>
        <label>基金</label>
        <select id="inFund">
          <option value="American">American 美國股票基金</option>
          <option value="Asia">Asia 亞洲股票基金</option>
          <option value="Global">Global 環球股票基金</option>
          <option value="Growth">Growth 增長基金</option>
        </select>
      </div>
      <div>
        <label>股數（轉出/賣出用負數）</label>
        <input type="number" id="inUnits" step="0.001" placeholder="例如 65.348 或 -1000">
      </div>
      <div>
        <label>單位價 (NAV)</label>
        <input type="number" id="inPrice" step="0.0001" placeholder="例如 11.48">
      </div>
      <div>
        <label>佣金/雜費（回贈用負數）</label>
        <input type="number" id="inCommission" step="0.01" placeholder="0">
      </div>
      <div><button class="action" onclick="addTransaction()">加入暫存</button></div>
    </div>
    <div class="note">
      呢個表單新增嘅記錄只會存喺你呢部電腦嘅瀏覽器 (localStorage)，唔會自動上傳。
      要保留就用「匯出 JSON」下載成檔案，自己更新落去資料源；唔要就用「清空暫存」刪走。
    </div>
    <div class="form-row" style="margin-top:10px;">
      <button class="action secondary" onclick="exportData()">⬇ 匯出全部資料 (JSON)</button>
      <button class="action danger" onclick="clearPending()">🗑 清空暫存交易</button>
    </div>
  </div>

  <div class="panel">
    <h3>供款 / 轉換歷史</h3>
    <div class="table-wrap">
      <table id="txTable">
        <thead><tr>
          <th>日期</th><th>基金</th><th>股數</th><th>單位價</th><th>佣金/回贈</th>
          <th>金額</th><th>累積股數</th><th>累積成本</th><th>市值</th><th>損益</th><th>損益%</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 走勢圖 -->
<div class="tab-content" id="tab-history">
  <div class="panel">
    <h3>組合走勢</h3>
    <div class="chart-wrap"><canvas id="totalChart"></canvas></div>
    <div class="note" id="xirrNote"></div>
  </div>
</div>

<!-- 個股 -->
<div class="tab-content" id="tab-detail">
  <div class="panel">
    <select id="fundSelect" onchange="renderDetail()">
      <option value="American">American 美國股票基金</option>
      <option value="Asia">Asia 亞洲股票基金</option>
      <option value="Global">Global 環球股票基金</option>
      <option value="Growth">Growth 增長基金</option>
    </select>
    <div id="fundSummary" class="cards" style="padding:0 0 14px;"></div>
    <div class="chart-wrap"><canvas id="fundChart"></canvas></div>
  </div>
  <div class="panel">
    <h3>該基金完整交易記錄</h3>
    <div class="table-wrap">
      <table id="fundDetailTable">
        <thead><tr>
          <th>日期</th><th>股數</th><th>單位價</th><th>佣金/回贈</th><th>金額</th>
          <th>累積股數</th><th>累積成本</th><th>市值</th><th>損益</th><th>損益%</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

/* ---------- 工具函式 ---------- */
function parseDate(s){
  if(s.indexOf('-')>-1){ const [y,m,d]=s.split('-'); return new Date(+y,+m-1,+d); }
  const [d,m,y]=s.split('/'); return new Date(+y,+m-1,+d);
}
function fmtMoney(n){
  const neg = n<0; n=Math.abs(n);
  return (neg?'-':'')+'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPct(n){ return (n>=0?'+':'')+n.toFixed(2)+'%'; }
function cls(n){ return n>=0?'pos':'neg'; }

/* ---------- localStorage 暫存 ---------- */
function loadPending(){ return JSON.parse(localStorage.getItem('mpfPendingTx')||'[]'); }
function savePending(a){ localStorage.setItem('mpfPendingTx', JSON.stringify(a)); }

function addTransaction(){
  const date = document.getElementById('inDate').value;
  const fund = document.getElementById('inFund').value;
  const units = parseFloat(document.getElementById('inUnits').value);
  const price = parseFloat(document.getElementById('inPrice').value);
  const commission = parseFloat(document.getElementById('inCommission').value)||0;
  if(!date || isNaN(units) || isNaN(price)){ alert('請填齊日期／股數／單位價'); return; }
  const arr = loadPending();
  arr.push({id:Date.now()+Math.random(), fund, date, units, price, commission});
  savePending(arr);
  document.getElementById('inUnits').value='';
  document.getElementById('inPrice').value='';
  document.getElementById('inCommission').value='';
  renderAll();
}
function deletePending(id){
  savePending(loadPending().filter(p=>p.id!==id));
  renderAll();
}
function clearPending(){
  if(confirm('確定清空所有暫存交易？')){ savePending([]); renderAll(); }
}
function exportData(){
  const pending = loadPending();
  const merged = {};
  FUND_KEYS.forEach(k=>{
    merged[k] = RAW[k].rows.concat(
      pending.filter(p=>p.fund===k).map(p=>[p.date,p.units,p.price,p.commission])
    );
  });
  const blob = new Blob([JSON.stringify(merged,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='mpf_data_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}

/* ---------- 核心計算 ---------- */
// 合併某基金嘅base rows + pending，並依日期排序
function getMergedRows(key){
  const pending = loadPending().filter(p=>p.fund===key)
    .map(p=>({date:p.date, units:p.units, price:p.price, commission:p.commission||0, isPending:true, id:p.id}));
  const base = RAW[key].rows.map(r=>({date:r[0], units:r[1], price:r[2], commission:r[3]||0, isPending:false, id:null}));
  return base.concat(pending).sort((a,b)=>parseDate(a.date)-parseDate(b.date));
}
// 逐行計算累積股數/成本/市值/損益
function process(rows){
  let cumUnits=0, cumCost=0;
  return rows.map(r=>{
    const amount = r.units*r.price + r.commission;
    cumUnits += r.units;
    cumCost  += amount;
    const marketValue = cumUnits*r.price;
    const pnl = marketValue - cumCost;
    const pnlPct = cumCost!==0 ? pnl/cumCost*100 : 0;
    const avgCost = cumUnits!==0 ? cumCost/cumUnits : 0;
    return { ...r, dateObj:parseDate(r.date), amount, cumUnits, cumCost, marketValue, pnl, pnlPct, avgCost };
  });
}
function getFundHistory(key){ return process(getMergedRows(key)); }

/* XIRR (Newton's method) */
function xirr(cashflows){
  if(cashflows.length<2) return NaN;
  const t0 = cashflows[0].date;
  function npv(rate){
    return cashflows.reduce((acc,cf)=>{
      const t = (cf.date-t0)/(1000*3600*24*365);
      return acc + cf.amount/Math.pow(1+rate, t);
    },0);
  }
  function dnpv(rate){
    return cashflows.reduce((acc,cf)=>{
      const t = (cf.date-t0)/(1000*3600*24*365);
      if(t===0) return acc;
      return acc - t*cf.amount/Math.pow(1+rate, t+1);
    },0);
  }
  let rate=0.1;
  for(let i=0;i<200;i++){
    const f=npv(rate), df=dnpv(rate);
    if(Math.abs(df)<1e-10) break;
    const nr = rate - f/df;
    if(!isFinite(nr)) break;
    if(Math.abs(nr-rate)<1e-8){ rate=nr; break; }
    rate=nr;
  }
  return rate;
}
function fundXirr(hist){
  if(hist.length===0) return NaN;
  const flows = hist.map(h=>({date:h.dateObj, amount:-h.amount}));
  const last = hist[hist.length-1];
  flows.push({date:last.dateObj, amount:last.marketValue});
  return xirr(flows);
}
function totalXirr(allHist){
  // 按日期加總所有基金金額（內部轉換會自動抵消）
  const map = {};
  allHist.forEach(h=>{
    const key = h.dateObj.getTime();
    map[key] = (map[key]||0) - h.amount;
  });
  const flows = Object.keys(map).map(k=>({date:new Date(+k), amount:map[k]}))
    .sort((a,b)=>a.date-b.date);
  const totalValue = FUND_KEYS.reduce((s,k)=>{
    const h = getFundHistory(k);
    return s + (h.length? h[h.length-1].marketValue : 0);
  },0);
  const lastDate = flows.length? flows[flows.length-1].date : new Date();
  flows.push({date:lastDate, amount:totalValue});
  return xirr(flows);
}

/* ---------- 渲染：持倉 ---------- */
function renderPositions(){
  const tbody = document.querySelector('#positionsTable tbody');
  tbody.innerHTML='';
  let totalCost=0, totalValue=0;
  const rowsData = FUND_KEYS.map(k=>{
    const h = getFundHistory(k);
    const last = h[h.length-1];
    totalCost += last.cumCost; totalValue += last.marketValue;
    return {k, last};
  });
  rowsData.forEach(({k,last})=>{
    const share = totalValue? last.marketValue/totalValue*100 : 0;
    tbody.innerHTML += `<tr>
      <td><span class="fund-tag tag-${k}">${RAW[k].name}</span></td>
      <td>${last.cumUnits.toFixed(3)}</td>
      <td>${fmtMoney(last.avgCost)}</td>
      <td>${fmtMoney(last.cumCost)}</td>
      <td>${fmtMoney(last.price)}</td>
      <td>${fmtMoney(last.marketValue)}</td>
      <td class="${cls(last.pnl)}">${fmtMoney(last.pnl)}</td>
      <td class="${cls(last.pnlPct)}">${fmtPct(last.pnlPct)}</td>
      <td>${share.toFixed(1)}%</td>
    </tr>`;
  });
  const totalPnl = totalValue-totalCost;
  const totalPnlPct = totalCost? totalPnl/totalCost*100 : 0;
  tbody.innerHTML += `<tr style="font-weight:700;">
    <td>總計</td><td></td><td></td>
    <td>${fmtMoney(totalCost)}</td><td></td>
    <td>${fmtMoney(totalValue)}</td>
    <td class="${cls(totalPnl)}">${fmtMoney(totalPnl)}</td>
    <td class="${cls(totalPnlPct)}">${fmtPct(totalPnlPct)}</td><td>100%</td>
  </tr>`;

  // summary cards
  const overallXirr = totalXirr(FUND_KEYS.flatMap(k=>getFundHistory(k)));
  document.getElementById('summaryCards').innerHTML = `
    <div class="card"><div class="label">累積供款成本</div><div class="value">${fmtMoney(totalCost)}</div></div>
    <div class="card"><div class="label">現時總市值</div><div class="value">${fmtMoney(totalValue)}</div></div>
    <div class="card"><div class="label">帳面損益</div><div class="value ${cls(totalPnl)}">${fmtMoney(totalPnl)} (${fmtPct(totalPnlPct)})</div></div>
    <div class="card"><div class="label">年化回報 XIRR</div><div class="value ${cls(overallXirr)}">${isFinite(overallXirr)?(overallXirr*100).toFixed(2)+'%':'—'}</div></div>
  `;
}

/* ---------- 渲染：走勢圖 ---------- */
let totalChartInst=null;
function renderHistoryChart(){
  const histories = {};
  FUND_KEYS.forEach(k=> histories[k]=getFundHistory(k));
  const allDatesSet = new Set();
  FUND_KEYS.forEach(k=> histories[k].forEach(h=>allDatesSet.add(h.dateObj.getTime())));
  const allDates = Array.from(allDatesSet).sort((a,b)=>a-b).map(t=>new Date(+t));

  function seriesFor(hist){
    let idx=-1; const vals=[], costs=[];
    allDates.forEach(d=>{
      while(idx+1<hist.length && hist[idx+1].dateObj<=d) idx++;
      vals.push(idx<0?0:hist[idx].marketValue);
      costs.push(idx<0?0:hist[idx].cumCost);
    });
    return {vals,costs};
  }
  const perFund = {};
  FUND_KEYS.forEach(k=> perFund[k]=seriesFor(histories[k]));

  const totalValueSeries = allDates.map((_,i)=> FUND_KEYS.reduce((s,k)=>s+perFund[k].vals[i],0));
  const totalCostSeries  = allDates.map((_,i)=> FUND_KEYS.reduce((s,k)=>s+perFund[k].costs[i],0));

  const labels = allDates.map(d=>d.toLocaleDateString('zh-HK',{year:'2-digit',month:'2-digit',day:'2-digit'}));

  const datasets = [
    { label:'組合總市值', data:totalValueSeries, borderColor:'#4d7cff', backgroundColor:'rgba(77,124,255,.15)', fill:true, tension:.2, borderWidth:2 },
    { label:'累積供款成本', data:totalCostSeries, borderColor:'#8b95ab', borderDash:[5,4], fill:false, tension:0, borderWidth:1.5, pointRadius:0 }
  ];
  FUND_KEYS.forEach(k=>{
    datasets.push({ label:RAW[k].name, data:perFund[k].vals, borderColor:RAW[k].color, fill:false, borderWidth:1, pointRadius:0, hidden:true });
  });

  if(totalChartInst) totalChartInst.destroy();
  totalChartInst = new Chart(document.getElementById('totalChart'), {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{ legend:{labels:{color:'#e8ecf5'}} },
      scales:{
        x:{ ticks:{color:'#8b95ab',maxTicksLimit:16}, grid:{color:'#2b3550'} },
        y:{ ticks:{color:'#8b95ab', callback:v=>'$'+v.toLocaleString()}, grid:{color:'#2b3550'} }
      }
    }
  });

  const overallXirr = totalXirr(FUND_KEYS.flatMap(k=>getFundHistory(k)));
  let noteHtml = `全組合年化回報 (XIRR)：<b class="${cls(overallXirr)}">${isFinite(overallXirr)?(overallXirr*100).toFixed(2)+'%':'—'}</b><br>各基金：`;
  FUND_KEYS.forEach(k=>{
    const x = fundXirr(getFundHistory(k));
    noteHtml += ` ${RAW[k].name} <b class="${cls(x)}">${isFinite(x)?(x*100).toFixed(2)+'%':'—'}</b> ・`;
  });
  document.getElementById('xirrNote').innerHTML = noteHtml;
}

renderAll();
