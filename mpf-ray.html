<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPF · Ray</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js" integrity="sha384-Cs3dgUx6+jDxxuqHvVH8Onpyj2LF1gKZurLDlhqzuJmUqVYMJ0THTWpxK5Z086Zm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js" integrity="sha384-zPzbVRXfR492Sd5D+HydTYCxxgHAfgVO8KERbLlpeH5unsmbAEXrscGUUqLZG9BM" crossorigin="anonymous"></script>
<link rel="stylesheet" href="fund.css">
</head>
<body data-file="data/mpf-ray.json">
<header>
  <div class="hrow"><h1 id="title">…</h1></div>
  <div class="sub loading" id="upd">載入中…</div>
  <nav class="pagenav">
    <a href="index.html">DigiPortfolio</a>
    <a href="mpf-ray.html" class="on">MPF Ray</a>
    <a href="mpf-sherina.html">MPF Sherina</a>
    <a href="pf-sherina.html">PF Sherina</a>
  </nav>
</header>
<div class="kpis" id="kpis"></div>
<nav role="tablist">
  <button data-t="hold" class="on" role="tab" aria-selected="true">持倉</button>
  <button data-t="hist" role="tab" aria-selected="false">歷史</button>
  <button data-t="tx" role="tab" aria-selected="false">交易</button>
  <button data-t="fund" role="tab" aria-selected="false">基金</button>
</nav>
<section id="hold" class="on" role="tabpanel" aria-hidden="false"><div class="wrap" id="holdT"></div></section>
<section id="hist" role="tabpanel" aria-hidden="true">
  <div class="bar" id="histBar"><span class="hint">滾輪／兩指縮放，拖曳平移</span></div>
  <canvas id="chart"></canvas><div class="wrap" id="histT"></div>
</section>
<section id="tx" role="tabpanel" aria-hidden="true"><div class="wrap" id="txT"></div></section>
<section id="fund" role="tabpanel" aria-hidden="true">
  <div class="bar" id="fundBar"><select id="fundSel"></select><span class="hint">圖例撳一下可隱藏該線</span></div>
  <canvas id="fundChart"></canvas>
  <div class="kpis" id="fundKpi" style="padding:0 0 10px"></div>
  <div class="wrap" id="fundT"></div>
</section>
<script src="fund.js"></script>
</body>
</html>
