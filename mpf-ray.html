/* ── XIRR 計算（Newton-Raphson，同大公司嗰套一樣邏輯） ── */
const YEAR_MS=31557600000, DAY_MS=86400000, MIN_AGE_DAYS=25;
function xirr(flows){
  if(flows.length<2)return null;
  const t0=new Date(flows[0].d), yr=f=>(new Date(f.d)-t0)/YEAR_MS;
  let r=0.1;
  for(let i=0;i<200;i++){
    let f=0,df=0;
    for(const c of flows){const t=yr(c),b=Math.pow(1+r,t);f+=c.v/b;df-=t*c.v/(b*(1+r));}
    if(Math.abs(df)<1e-12)return null;
    const nr=r-f/df;
    if(!isFinite(nr)||nr<-0.99)return null;
    if(Math.abs(nr-r)<1e-8)return nr;
    r=nr;
  }
  return null;
}
// 用「成本變化」嚟推斷你出咗幾多錢（增加=出錢=負數現金流）
function costFlows(rows,uptoIdx){
  const flows=[];let prev=0;
  for(let i=0;i<=uptoIdx;i++){
    const delta=rows[i].cost-prev;
    if(Math.abs(delta)>0.01)flows.push({d:rows[i].d,v:-delta});
    prev=rows[i].cost;
  }
  return flows;
}
// 幫每一行計「截至嗰個月」嘅年化XIRR
function runningXIRR(rows){
  if(!rows.length)return rows;
  const t0=new Date(rows[0].d);
  return rows.map((r,i)=>{
    const age=(new Date(r.d)-t0)/DAY_MS;
    if(age<MIN_AGE_DAYS||r.mv<=0)return {...r,irr:null};
    const flows=[...costFlows(rows,i),{d:r.d,v:r.mv}];
    return {...r,irr:xirr(flows)};
  });
}
// 攞最後一個「有效」嘅XIRR（就算戶口賣清咗，都攞返賣清之前嗰個做終身回報）
const lastValidIRR=rows=>{
  for(let i=rows.length-1;i>=0;i--)if(rows[i].irr!=null)return rows[i].irr;
  return null;
};

/* ── 處理原始DATA ── */
const toRows=arr=>arr.map(([d,cost,mv])=>({d,cost,mv,pl:mv-cost}));
// Invesco專用：由「單次金額」累加做cost
function toRowsFromFlows(arr){
  let cost=0;
  return arr.map(([d,amt,mv])=>{
    cost+=amt;
    return {d,cost,mv,pl:mv-cost};
  });
}
const invescoRows = runningXIRR(toRowsFromFlows(DATA.invesco));

const fundNames=Object.keys(DATA.fidelity);
const fundRows={};
fundNames.forEach(f=>fundRows[f]=runningXIRR(toRows(DATA.fidelity[f])));

// 合併四隻基金做 Fidelity 總計
function buildOverall(fundsObj){
  const dateSet=new Set();
  Object.values(fundsObj).forEach(rows=>rows.forEach(r=>dateSet.add(r.d)));
  const dates=[...dateSet].sort();
  const state={};fundNames.forEach(f=>state[f]={cost:0,mv:0});
  const idx={};fundNames.forEach(f=>idx[f]=0);
  const out=[];
  for(const d of dates){
    for(const f of fundNames){
      const rows=fundsObj[f];
      while(idx[f]<rows.length&&rows[idx[f]].d<=d){
        state[f]={cost:rows[idx[f]].cost,mv:rows[idx[f]].mv};
        idx[f]++;
      }
    }
    let cost=0,mv=0;
    fundNames.forEach(f=>{cost+=state[f].cost;mv+=state[f].mv;});
    out.push({d,cost,mv,pl:mv-cost});
  }
  return out;
}
const fidOverallRows=runningXIRR(buildOverall(fundRows));

// 總覽：Invesco接住Fidelity合併，做一條長線
// 注意：呢條線嘅XIRR假設Invesco賣清果筆錢冇再投入Fidelity（純粹兩個獨立戶口相連），
// 如果實際上Invesco賣咗嘅錢係搬咗去開Fidelity，呢個XIRR會略為失真，
// 純粹供參考，各自產品自己嗰個XIRR（Invesco tab / Fidelity合併 tab）先係最準。
const overviewRaw=[...invescoRows.map(r=>({d:r.d,cost:r.cost,mv:r.mv,pl:r.pl})),
                   ...fidOverallRows.map(r=>({d:r.d,cost:r.cost,mv:r.mv,pl:r.pl}))];
const overviewRows=runningXIRR(overviewRaw);

/* ── KPI ── */
function renderKpis(){
  const latest=fidOverallRows[fidOverallRows.length-1]||{cost:0,mv:0,pl:0};
  const fidIRR=lastValidIRR(fidOverallRows);
  const invescoFinal=invescoRows[invescoRows.length-1]||{cost:0,mv:0,pl:0};
  const invescoIRR=lastValidIRR(invescoRows);
  const overallIRR=lastValidIRR(overviewRows);
  $('#kpis').innerHTML=[
    ['而家總成本',fmt(latest.cost)],
    ['而家總市值',fmt(latest.mv)],
    ['而家損益',`<span class="${cls(latest.pl)}">${fmt(latest.pl)} (${pct(latest.cost?latest.pl/latest.cost:null)})</span>`],
    ['Fidelity XIRR',`<span class="${cls(fidIRR)}">${pct(fidIRR)}</span>`],
    ['Invesco 終身XIRR',`<span class="${cls(invescoIRR)}">${pct(invescoIRR)}</span>`],
    ['全期XIRR(參考)',`<span class="${cls(overallIRR)}">${pct(overallIRR)}</span>`],
  ].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
}

/* ── 畫圖／畫表 ── */
const charts={};
function baseOpt(){
  return {animation:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'bottom'}},
    scales:{x:{ticks:{maxTicksLimit:8}},y:{ticks:{callback:v=>(v/1000).toFixed(0)+'k'}}}};
}
function drawLineChart(canvasId,key,rows){
  charts[key]?.destroy();
  const o=baseOpt();
  o.scales.y1={position:'right',grid:{drawOnChartArea:false},
    ticks:{callback:v=>(v/1000).toFixed(0)+'k'},title:{display:true,text:'損益',font:{size:10}}};
  charts[key]=new Chart($(canvasId),{type:'line',data:{labels:rows.map(r=>r.d),datasets:[
    {label:'市值',data:rows.map(r=>r.mv),borderColor:'#0a7d3b',pointRadius:0,tension:.2,yAxisID:'y'},
    {label:'成本',data:rows.map(r=>r.cost),borderColor:'#999',borderDash:[4,4],pointRadius:0,stepped:true,yAxisID:'y'},
    {label:'損益',data:rows.map(r=>r.pl),pointRadius:0,tension:.2,borderWidth:1.5,yAxisID:'y1',
      segment:{borderColor:c=>c.p1.parsed.y>=0?'#0a7d3b':'#c0392b'},borderColor:'#0a7d3b',
      fill:{target:'origin',above:'rgba(10,125,59,.10)',below:'rgba(192,57,43,.10)'}}
  ]},options:o});
}
function drawTable(elId,rows){
  const body=[...rows].reverse().map(r=>`<tr><td>${r.d}</td><td>${fmt(r.cost)}</td><td>${fmt(r.mv)}</td>
    <td class="${cls(r.pl)}">${fmt(r.pl)}</td><td class="${cls(r.pl)}">${pct(r.cost?r.pl/r.cost:null)}</td>
    <td class="${cls(r.irr)}">${pct(r.irr)}</td></tr>`).join('');
  $(elId).innerHTML=`<table><thead><tr><th>日期</th><th>成本</th><th>市值</th><th>損益</th><th>%</th><th>XIRR</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

const fundSel=$('#fundSel');
fundSel.innerHTML=fundNames.map(f=>`<option value="${f}">${f}</option>`).join('');
fundSel.onchange=()=>drawFund(fundSel.value);
function drawFund(name){
  const rows=fundRows[name];
  drawLineChart('#chartFund','fund',rows);
  drawTable('#tblFund',rows);
}

function renderAll(){
  renderKpis();
  drawLineChart('#chartOverview','overview',overviewRows);
  drawTable('#tblOverview',overviewRows);
  drawLineChart('#chartInvesco','invesco',invescoRows);
  drawTable('#tblInvesco',invescoRows);
  drawFund(fundNames[0]);
  drawLineChart('#chartFidOverall','fidoverall',fidOverallRows);
  drawTable('#tblFidOverall',fidOverallRows);
}
renderAll();
</script>
</body>
</html>
